
<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Gmail 影片批次寄送系統</title>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
*{box-sizing:border-box}
body{font-family:Arial,sans-serif;background:#f2f5fa;margin:0;padding:15px;color:#243044}
main{max-width:700px;margin:auto}
h1{text-align:center;font-size:25px}
section{background:white;padding:20px;margin:15px 0;border-radius:12px;box-shadow:0 2px 8px #0001}
input,textarea{width:100%;padding:12px;margin:8px 0;border:1px solid #bbb;border-radius:7px;font-size:16px}
button{background:#1769d2;color:white;border:0;border-radius:8px;padding:12px 16px;margin:6px 4px 6px 0;font-size:15px}
button:disabled{opacity:.4}
.secondary{background:#58677a}
.danger{background:#b63d36}
small{color:#596779}
#status,#summary{background:#edf3fa;padding:12px;border-radius:8px;white-space:pre-wrap}
progress{width:100%;height:20px}
li{padding:8px 0;overflow-wrap:anywhere}
.ok{color:green}.fail{color:#bd3030}
</style>
</head>
<body>
<main>
<h1>📨 Gmail 影片批次寄送系統</h1>

<section>
<h3>① Gmail 帳號授權</h3>
<button id="login">登入 Gmail</button>
<button id="logout" class="secondary">解除授權</button>
<p id="status">尚未登入</p>
</section>

<section>
<h3>② 郵件設定</h3>
<label>收件者電子郵件</label>
<input id="receiver" type="email" placeholder="example@gmail.com">
<label>郵件主旨</label>
<input id="subject" value="影片資料">
<label>郵件內容</label>
<textarea id="message">您好，附件為影片，請查收。</textarea>
</section>

<section>
<h3>③ 選擇影片</h3>
<input type="file" id="videos" accept="video/*" multiple>
<p id="fileCount">尚未選擇影片</p>
<small>最多130部，每部必須小於20MB。請先自行分割影片。</small>
</section>

<section>
<h3>④ 批次寄送</h3>
<button id="send">開始寄送</button>
<button id="stop" class="danger">停止後續寄送</button>
<button id="retry" class="secondary">重試失敗項目</button>
<progress id="progress" value="0" max="1"></progress>
<p id="summary">尚未開始</p>
<ul id="results"></ul>
</section>

<section>
<h3>注意事項</h3>
<p>寄送時請保持網頁開啟，避免手機休眠。Gmail 寄送量與郵件大小仍受 Google 限制。</p>
<p>請先寄送一部影片測試，再進行大量寄送。</p>
</section>
</main>

<script>
const CLIENT_ID =
"612458875877-1ollgc131numte9m68512cotu26b2qri.apps.googleusercontent.com";

const SCOPE =
"https://www.googleapis.com/auth/gmail.send";

const $ = id => document.getElementById(id);

let token = "";
let client;
let jobs = [];
let running = false;
let stopping = false;

function updateStatus(text){
  $("status").textContent=text;
}

function initGoogle(){
  if(!window.google?.accounts?.oauth2){
    updateStatus("Google 登入尚未載入，請稍候再試");
    return false;
  }
  if(!client){
    client=google.accounts.oauth2.initTokenClient({
      client_id:CLIENT_ID,
      scope:SCOPE,
      callback:response=>{
        if(response.error){
          updateStatus("授權失敗："+response.error);
          return;
        }
        token=response.access_token;
        updateStatus("Gmail 已授權，可以寄送影片");
      }
    });
  }
  return true;
}

$("login").onclick=()=>{
  if(initGoogle()){
    client.requestAccessToken();
  }
};

$("logout").onclick=()=>{
  if(token){
    google.accounts.oauth2.revoke(token,()=>{});
  }
  token="";
  updateStatus("已解除授權");
};

$("videos").onchange=()=>{
  const files=Array.from($("videos").files);
  jobs=files.map((file,index)=>({
    file,index,state:"pending",error:""
  }));

  const tooBig=files.filter(
    file=>file.size>=20000000
  );

  $("fileCount").textContent=
    `已選擇 ${files.length} 部影片；過大 ${tooBig.length} 部`;

  $("progress").value=0;
  $("progress").max=Math.max(files.length,1);
  render();
};

function render(){
  const success=jobs.filter(
    x=>x.state==="sent"
  ).length;

  const failed=jobs.filter(
    x=>x.state==="failed"
  ).length;

  $("progress").max=Math.max(jobs.length,1);
  $("progress").value=success+failed;

  $("summary").textContent=
    `總數：${jobs.length}\n成功：${success}\n失敗：${failed}\n未完成：${jobs.length-success-failed}`;

  $("results").replaceChildren();

  jobs.forEach(job=>{
    const li=document.createElement("li");
    li.textContent=
      `${job.index+1}. ${job.file.name} — ${job.state}`+
      (job.error?`：${job.error}`:"");
    li.className=
      job.state==="sent"?"ok":
      job.state==="failed"?"fail":"";
    $("results").appendChild(li);
  });
}

function b64(bytes){
  let result="";
  for(let i=0;i<bytes.length;i+=8192){
    result+=String.fromCharCode(
      ...bytes.subarray(i,i+8192)
    );
  }
  return btoa(result);
}

function utf8(text){
  return new TextEncoder().encode(text);
}

function encodedHeader(text){
  return "=?UTF-8?B?"+b64(utf8(text))+"?=";
}

function base64url(bytes){
  return b64(bytes)
    .replace(/\+/g,"-")
    .replace(/\//g,"_")
    .replace(/=+$/,"");
}

async function makeEmail(job){
  const boundary="video_"+Date.now();
  const file=job.file;

  const bytes=new Uint8Array(
    await file.arrayBuffer()
  );

  const attachment=b64(bytes).replace(
    /.{1,76}/g,"$&\r\n"
  );

  const body=b64(
    utf8($("message").value)
  );

  const filename=file.name.replace(
    /[\r\n"\\]/g,"_"
  );

  const subject=
    $("subject").value+
    ` (${job.index+1}/${jobs.length})`;

  const mime=
`To: ${$("receiver").value.trim()}
Subject: ${encodedHeader(subject)}
MIME-Version: 1.0
Content-Type: multipart/mixed; boundary="${boundary}"

--${boundary}
Content-Type: text/plain; charset=UTF-8
Content-Transfer-Encoding: base64

${body}

--${boundary}
Content-Type: application/octet-stream
Content-Disposition: attachment; filename="${encodedHeader(filename)}"
Content-Transfer-Encoding: base64

${attachment}
--${boundary}--`;

  const raw=utf8(mime.replace(/\r?\n/g,"\r\n"));

  if(raw.length>25000000){
    throw Error("編碼後郵件超過25MB");
  }

  return base64url(raw);
}

async function sendEmail(job){
  const raw=await makeEmail(job);

  const response=await fetch(
    "https://gmail.googleapis.com/gmail/v1/users/me/messages/send",
    {
      method:"POST",
      headers:{
        Authorization:"Bearer "+token,
        "Content-Type":"application/json"
      },
      body:JSON.stringify({raw})
    }
  );

  if(!response.ok){
    let data={};
    try{data=await response.json()}catch(e){}
    if(response.status===401){
      token="";
      updateStatus("授權過期，請重新登入");
    }
    throw Error(
      data.error?.message||`HTTP ${response.status}`
    );
  }

  return response.json();
}

async function execute(retryOnly=false){
  if(running)return;

  if(!token){
    alert("請先登入 Gmail");
    return;
  }

  const receiver=$("receiver");

  if(!receiver.value.trim()||
     !receiver.checkValidity()){
    alert("請輸入正確的收件者信箱");
    return;
  }

  if(!jobs.length||jobs.length>130){
    alert("請選擇1至130部影片");
    return;
  }

  if(jobs.some(x=>x.file.size>=20000000)){
    alert("有影片超過或等於20MB");
    return;
  }

  const targets=jobs.filter(x=>
    retryOnly?x.state==="failed":x.state==="pending"
  );

  if(!targets.length){
    alert("沒有需要寄送的影片");
    return;
  }

  if(!confirm(
    `即將寄送 ${targets.length} 封郵件到 ${receiver.value}，確定嗎？`
  ))return;

  running=true;
  stopping=false;

  for(const job of targets){
    if(stopping||!token)break;

    job.state="sending";
    job.error="";
    render();

    try{
      await sendEmail(job);
      job.state="sent";
    }catch(error){
      job.state="failed";
      job.error=error.message;
    }

    render();

    await new Promise(resolve=>
      setTimeout(resolve,1000)
    );
  }

  running=false;
  render();
}

$("send").onclick=()=>execute(false);
$("retry").onclick=()=>execute(true);
$("stop").onclick=()=>{
  stopping=true;
  alert("已要求停止，正在寄送的郵件可能仍會完成");
};

render();
</script>
</body>
</html>
