async function prepare() {

    for (let i = 0; i < files.length; i++) {
      checkStop(); prepProgress.index = i;
      const file = files[i], input = inputCopies.get(file) || file;
      status(`處理 ${i+1}/${files.length}：${file.name}`);
      let parts;

        try {

    }

    status(`準備完成：共 ${items.length} 個附件，請確認後開始寄送`);
  } catch (error) {
    prepared = false; $('workProgress').textContent = `已停止｜共用 ${((performance.now()-started)/1000).toFixed(1)} 秒`;
    status('準備未完成：'+errorMessage(error));

$('prepare').onclick=prepare;$('stop').onclick=()=>{stopRequested=true;status('已要求暫停；等待目前操作完成…')};
function b64utf8(s){return btoa(unescape(encodeURIComponent(s)))}

async function sendOne(item,index){const boundary='v448_'+Date.now()+'_'+index,email=$('recipient').value.trim(),subject=($('subject').value.trim()||'影片附件')+' '+(index+1)+'/'+items.length,filename=item.name.replace(/[\r\n"\\]/g,'_');const header=`To: ${email}\r\nSubject: =?UTF-8?B?${b64utf8(subject)}?=\r\nMIME-Version: 1.0\r\nContent-Type: multipart/mixed; boundary="${boundary}"\r\n\r\n--${boundary}\r\nContent-Type: text/plain; charset=UTF-8\r\nContent-Transfer-Encoding: base64\r\n\r\n${b64utf8('影片附件：'+filename)}\r\n--${boundary}\r\nContent-Type: ${item.blob.type||'application/octet-stream'}; name="attachment"\r\nContent-Disposition: attachment; filename="${filename}"\r\nContent-Transfer-Encoding: base64\r\n\r\n`;const bytes=new Uint8Array(await item.blob.arrayBuffer());let attachment='';for(let i=0;i<bytes.length;i+=3*8192){const part=bytes.subarray(i,i+3*8192);let binary='';for(let j=0;j<part.length;j++)binary+=String.fromCharCode(part[j]);attachment+=btoa(binary)}const raw=b64urlBytes(new TextEncoder().encode(header+attachment+`\r\n--${boundary}--\r\n`));const res=await fetch('https://gmail.googleapis.com/gmail/v1/users/me/messages/send',{method:'POST',headers:{Authorization:'Bearer '+token,'Content-Type':'application/json'},body:JSON.stringify({raw})});if(!res.ok){const detail=await res.text();if(res.status===401)token='';throw Error(`Gmail HTTP ${res.status}: ${detail.slice(0,240)}`)}return await res.json()}
async function sendQueue(failedOnly=false){

    if(!token)throw Error('請先連結 Gmail');
    if(!$('recipient').checkValidity()||!$('recipient').value.trim())throw Error('請輸入正確收件信箱');
    const targets=items.filter(x=>failedOnly?x.state==='failed':x.state==='ready'||x.state==='failed');
    if(!targets.length)throw Error('沒有可寄送附件');
    const concurrency=2;

        const idx=items.indexOf(x);
        status(`雙封加速：寄送第 ${idx+1}/${items.length} 段（同時進行 ${active} 封）`);

  finally{setBusy(false);refresh()}
}
