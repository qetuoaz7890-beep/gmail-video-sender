</style></head><body><main><h1>📨 大量發送小工具</h1><div class="muted">手機優先｜Gmail 附件寄送｜19MiB 分割｜雙封並行寄送｜無累計容量上限</div>
<section class="panel"><h2>① Gmail 設定</h2><button id="login">連結 Gmail</button><button class="secondary" id="logout">中斷連線</button><div id="authState" class="muted">尚未連線</div><label>收件人 Email</label><input id="recipient" type="email" placeholder="name@company.com"><label>主旨</label><input id="subject" value="影片附件"></section>

async function loadFFmpeg(){if(ffmpeg)return ffmpeg;if(loadingFFmpeg)return loadingFFmpeg;loadingFFmpeg=(async()=>{const base=new URL('./',location.href),coreJs=new URL('ffmpeg-core.js',base).href,coreWasm=new URL('ffmpeg-core.wasm',base).href;status('步驟 1/4：檢查本站 FFmpeg 核心…');for(const url of [coreJs,coreWasm]){const r=await fetch(url,{method:'HEAD',cache:'no-store',signal:AbortSignal.timeout(15000)});if(!r.ok)throw Error('核心檔案無法存取：'+url.split('/').pop()+' HTTP '+r.status)}status('步驟 2/4：載入 FFmpeg 控制程式…');const cdn='https://cdn.jsdelivr.net/npm/@ffmpeg/ffmpeg@0.12.15/dist/esm/';const mod=await import(cdn+'index.js');const util=await import('https://cdn.jsdelivr.net/npm/@ffmpeg/util@0.12.2/dist/esm/index.js');status('步驟 3/4：建立手機相容 Worker…');const response=await fetch(cdn+'worker.js',{signal:AbortSignal.timeout(20000)});if(!response.ok)throw Error('Worker 下載失敗：HTTP '+response.status);let source=await response.text();source=source.replace(/(from\s*['"]|import\s*\(\s*['"])(\.\.?\/[^'"]+)/g,(_,prefix,path)=>prefix+new URL(path,cdn).href);log('Worker 程式長度：'+source.length+' 字元');const workerUrl=URL.createObjectURL(new Blob([source],{type:'text/javascript'}));status('步驟 3/4：測試 Worker 是否能啟動…');const probeURL=URL.createObjectURL(new Blob([`postMessage('ready');`],{type:'text/javascript'}));try{await new Promise((resolve,reject)=>{const probe=new Worker(probeURL,{type:'module'});const timer=setTimeout(()=>{probe.terminate();reject(new Error('模組 Worker 測試逾時'))},12000);probe.onmessage=()=>{clearTimeout(timer);probe.terminate();resolve()};probe.onerror=e=>{clearTimeout(timer);probe.terminate();reject(new Error('模組 Worker 無法啟動：'+(e.message||'可能被瀏覽器或 CDN 阻擋')))};probe.onmessageerror=()=>{clearTimeout(timer);probe.terminate();reject(new Error('Worker 訊息格式錯誤'))}});log('Worker 模組測試成功')}finally{URL.revokeObjectURL(probeURL)}status('步驟 3/4：將 UMD 核心轉成 Worker 可載入的模組…');const coreResponse=await fetch(coreJs,{cache:'no-store',signal:AbortSignal.timeout(20000)});if(!coreResponse.ok)throw Error('下載 ffmpeg-core.js 失敗：HTTP '+coreResponse.status);const coreSource=await coreResponse.text();if(!coreSource.includes('createFFmpegCore'))throw Error('ffmpeg-core.js 內容不是預期的 FFmpeg 核心');const moduleSource=coreSource+'\nexport default createFFmpegCore;\n';const coreModuleURL=URL.createObjectURL(new Blob([moduleSource],{type:'text/javascript'}));log('已將本站 UMD 核心包裝成 ES Module（'+moduleSource.length+' 字元）');const engine=new mod.FFmpeg();engine.on('log',({message})=>{if(/error|failed|invalid/i.test(message))log('FFmpeg: '+message.slice(0,160))});status('步驟 4/4：啟動 FFmpeg（最多等待 60 秒）…');let timer;try{await Promise.race([engine.load({classWorkerURL:workerUrl,coreURL:coreModuleURL,wasmURL:coreWasm}),new Promise((_,reject)=>{timer=setTimeout(()=>reject(Error('啟動超過 60 秒；可能是 Worker 或手機記憶體限制')),60000)})])}catch(e){const detail=e instanceof Error?(e.stack||e.message):e&&typeof e==='object'?JSON.stringify(e,Object.getOwnPropertyNames(e)):String(e);log('FFmpeg 啟動錯誤：'+detail.slice(0,1200));try{engine.terminate()}catch(_){}throw new Error(detail==='undefined'?'Worker 啟動失敗，原始錯誤未提供內容（可能是模組載入或核心不相容）':detail)}finally{clearTimeout(timer);URL.revokeObjectURL(workerUrl);URL.revokeObjectURL(coreModuleURL)}ffmpeg={engine,util};status('FFmpeg 核心載入成功');return ffmpeg})();try{return await loadingFFmpeg}catch(e){status('FFmpeg 載入失敗：'+(e?.message||String(e)));throw e}finally{loadingFFmpeg=null}}
$('testCore').onclick=async()=>{if(running)return;running=true;try{await loadFFmpeg()}catch(e){log('核心診斷：'+(e?.message||String(e)))}finally{running=false}};
function clean(s){return s.replace(/[^a-zA-Z0-9._-]/g,'_').slice(0,70)||'video'}
function errorMessage(error) {
  if (error?.message) return String(error.message);
  if (typeof error === 'string' && error && error !== 'undefined') return error;
  try {
    const detail = JSON.stringify(error);
    if (detail && detail !== '{}' && detail !== 'null') return detail;
  } catch (_) {}
  return 'FFmpeg 未回傳錯誤內容';
}
async function splitVideo(file) {
  for (const useWorkerFS of [true, false]) {
    try {
      return await splitVideoOnce(file, useWorkerFS);
    } catch (error) {
      if (ffmpeg) {
        try { ffmpeg.engine.terminate() } catch (_) {}
        ffmpeg = null;
      }
      if (stopRequested || !useWorkerFS) throw Error(errorMessage(error));
      log('首次分割失敗：' + errorMessage(error));
      status('正在重建影片核心，改用完整讀取影片重試…');
    }
  }
}
async function splitVideoOnce(file, useWorkerFS) {
  const {engine, util} = await loadFFmpeg();
  const jobDir = '/split_' + Date.now();
  const inputDir = jobDir + '/input';
  const inputName = 'source_' + clean(file.name);
  const source = inputDir + '/' + inputName;
  const ext = file.name.split('.').pop().toLowerCase();
  const outputExt = ['webm', 'mkv'].includes(ext) ? ext : 'mp4';
  const mimeType = {mp4: 'video/mp4', webm: 'video/webm', mkv: 'video/x-matroska'}[outputExt];
  const outputPattern = jobDir + '/part_%06d.' + outputExt;
  const displayName = file.name.replace(/\.[^.]+$/, '');
  let mounted = false;
  let written = false;
  let cleanupFailed = false;
  let phase = '建立影片暫存目錄';
  const messages = [];
  const captureLog = ({message}) => {
    messages.push(String(message));
    if (messages.length > 30) messages.shift();
  };
  engine.on('log', captureLog);

  try {
    await engine.createDir(jobDir);
    await engine.createDir(inputDir);
    status(`載入影片：${file.name} (${(file.size / MB).toFixed(1)}MiB)`);
    phase = '讀取原始影片';
    if (useWorkerFS) {
      try {
        mounted = await engine.mount('WORKERFS', {blobs: [{name: inputName, data: file}]}, inputDir);
      } catch (error) {
        log('改用完整讀取影片：' + errorMessage(error));
      }
    }
    if (!mounted) {
      await engine.writeFile(source, await util.fetchFile(file));
      written = true;
    }

    let duration = 0;
    let videoCodec = '';
    const readMediaInfo = ({message}) => {
      const time = message.match(/Duration:\s*(\d+):(\d+):(\d+(?:\.\d+)?)/);
      if (time) duration = Number(time[1]) * 3600 + Number(time[2]) * 60 + Number(time[3]);
      const video = message.match(/Stream #0:\d+(?:\[[^\]]+\])?(?:\([^)]*\))?: Video: (\w+)/);
      if (!videoCodec && video && !message.includes('(attached pic)')) videoCodec = video[1];
    };
    phase = '讀取影片資訊';
    engine.on('log', readMediaInfo);
    try {
      await engine.exec(['-hide_banner', '-i', source]);
    } finally {
      engine.off('log', readMediaInfo);
    }
    if (!duration) throw Error('無法讀取影片時長，請先轉成 MP4');

    const initialSeconds = Math.max(0.5, duration * MAX / file.size * 0.78);
    const videoEncoding = outputExt === 'webm'
      ? ['-c:v', 'libvpx-vp9', '-deadline', 'realtime', '-cpu-used', '6', '-lag-in-frames', '0', '-crf', '32', '-b:v', '0', '-c:a', 'libopus']
      : ['-c:v', 'libx264', '-preset', 'ultrafast', '-crf', '23', '-bf', '0', '-pix_fmt', 'yuv420p', '-vf', 'pad=ceil(iw/2)*2:ceil(ih/2)*2', '-c:a', 'aac'];
    const keyframeFilter = {
      h264: 'h264_mp4toannexb,filter_units=pass_types=5',
      hevc: 'hevc_mp4toannexb,filter_units=pass_types=20'
    }[videoCodec];
    const copySupported = keyframeFilter || ['vp8', 'vp9', 'av1'].includes(videoCodec);
    const keyframePath = jobDir + '/keyframe.bin';

    // One sequential muxing pass allocates each source packet to only one part.
    // If a keyframe interval is too large, encode new keyframes before splitting.
    for (const encode of copySupported ? [false, true] : [true]) {
      let seconds = initialSeconds;
      let lastLargest = 0;
      for (let attempt = 0; attempt < (encode ? 4 : 3); attempt++) {
        if (stopRequested) throw Error('已暫停準備程序');
        status(`${encode ? '依切點重新編碼並分割' : '沿原片連續分割'}：${file.name}`);
        const interval = seconds.toFixed(3);
        const options = encode
          ? [...videoEncoding, '-fps_mode:v', 'passthrough', '-enc_time_base:v', '-1',
            '-force_key_frames', `expr:gte(t,n_forced*${interval})`]
          : ['-c', 'copy'];
        messages.length = 0;
        phase = encode ? '重新編碼並連續分割' : '沿原片連續分割';
        const code = await engine.exec([
          '-i', source, '-map', '0:V:0', '-map', '0:a?', ...options,
          '-f', 'segment', '-reference_stream', 'v:0', '-segment_time', interval,
          '-reset_timestamps', '1', '-y', outputPattern
        ]);
        phase = '讀取分割檔案清單';
        const paths = (await engine.listDir(jobDir))
          .filter(entry => !entry.isDir && entry.name.startsWith('part_'))
          .map(entry => jobDir + '/' + entry.name)
          .sort();

        const result = [];
        let largest = 0;
        let unsafeStart = false;
        try {
          if (stopRequested) throw Error('已暫停準備程序');
          if (code !== 0 || paths.length === 0) break;
          for (let i = 0; i < paths.length; i++) {
            if (stopRequested) throw Error('已暫停準備程序');
            const path = paths[i];
            phase = '讀取分割片段 ' + (i + 1);
            const data = await engine.readFile(path);
            if (!data.byteLength) throw Error('分割產生空檔案，請重新準備影片');
            largest = Math.max(largest, data.byteLength);
            if (largest <= MAX) {
              if (!encode && keyframeFilter) {
                // An open GOP can start with a keyframe that still needs a previous part.
                try {
                  messages.length = 0;
                  phase = '檢查片段起始畫面 ' + (i + 1);
                  const check = await engine.exec([
                    '-i', path, '-map', '0:v:0', '-c:v', 'copy', '-frames:v', '1',
                    '-bsf:v', keyframeFilter, '-f', videoCodec, '-y', keyframePath
                  ]);
                  unsafeStart = check !== 0 || (await engine.readFile(keyframePath)).byteLength === 0;
                } catch (_) {
                  unsafeStart = true;
                } finally {
                  try { await engine.deleteFile(keyframePath) } catch (_) {}
                }
                if (unsafeStart) break;
              }
              result.push({
                name: `${displayName}_part${String(i + 1).padStart(3, '0')}.${outputExt}`,
                blob: new Blob([data], {type: mimeType}),
                state: 'ready'
              });
            } else {
              result.length = 0;
            }
            await engine.deleteFile(path);
          }
        } finally {
          try {
            for (const entry of await engine.listDir(jobDir)) {
              if (!entry.isDir && entry.name.startsWith('part_')) {
                await engine.deleteFile(jobDir + '/' + entry.name);
              }
            }
          } catch (error) {
            cleanupFailed = true;
            log('片段暫存清理失敗：' + errorMessage(error));
          }
        }
        if (cleanupFailed) throw Error('無法清除片段暫存，正在重建影片核心');
        if (unsafeStart) break;
        if (result.length) {
          status(`已分割 ${file.name}：共 ${result.length} 段，最大 ${(largest / MB).toFixed(2)}MiB`);
          return result;
        }
        const shorter = Math.max(0.5, seconds * Math.min(0.65, (MAX / largest) * 0.85));
        if (shorter >= seconds || (!encode && largest === lastLargest)) break;
        lastLargest = largest;
        seconds = shorter;
      }
    }
    throw Error('無法連續分割成 19MiB 以內的影片；可先將原片轉為 MP4 或改用電腦');
  } catch (error) {
    const detail = errorMessage(error);
    const tail = messages.filter(message => !/^Aborted\(\)$/.test(message)).slice(-8).join(' | ');
    throw Error(phase + '失敗：' + detail + (tail ? '。FFmpeg：' + tail : ''));
  } finally {
    engine.off('log', captureLog);
    try {
      for (const entry of await engine.listDir(jobDir)) {
        if (!entry.isDir) await engine.deleteFile(jobDir + '/' + entry.name);
      }
      if (mounted) await engine.unmount(inputDir);
      if (written) await engine.deleteFile(source);
      await engine.deleteDir(inputDir);
      await engine.deleteDir(jobDir);
    } catch (error) {
      cleanupFailed = true;
      log('影片暫存清理失敗：' + errorMessage(error));
    }
    if (cleanupFailed && ffmpeg?.engine === engine) {
      try { engine.terminate() } catch (_) {}
      ffmpeg = null;
    }
  }
}
async function prepare() {
  if (running) return;
  running = true;
  stopRequested = false;
  try {
    const files = Array.from($('files').files);
    if (!files.length) throw Error('請先選擇影片');
    items = [];
    prepared = false;
    refresh();
    for (let i = 0; i < files.length; i++) {
      if (stopRequested) throw Error('已暫停準備程序，請重新準備');
      const file = files[i];
      if (!file.size) throw Error(file.name + ' 是空檔案');
      status(`處理 ${i + 1}/${files.length}：${file.name}`);
      const parts = file.size <= MAX
        ? [{name: file.name, blob: file, state: 'ready'}]
        : await splitVideo(file);
      for (const part of parts) {
        const extension = part.name.match(/\.[^.]+$/)?.[0] || '';
        part.name = String(items.length + 1).padStart(4, '0') + extension;
        items.push(part);
      }
      refresh();
    }
    prepared = true;
    status(`準備完成：共 ${items.length} 個附件，請確認後開始寄送`);
  } catch (error) {
    prepared = false;
    status('準備未完成：' + errorMessage(error));
  } finally {
    running = false;
    refresh();
  }
}
$('prepare').onclick=prepare;$('stop').onclick=()=>{stopRequested=true;status('已要求暫停；等待目前操作完成…')};
function b64utf8(s){return btoa(unescape(encodeURIComponent(s)))}
function b64urlBytes(bytes){let s='';for(let i=0;i<bytes.length;i+=32768)s+=String.fromCharCode(...bytes.subarray(i,i+32768));return btoa(s).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'')}
async function sendOne(item,index){const boundary='v448_'+Date.now()+'_'+index,email=$('recipient').value.trim(),subject=($('subject').value.trim()||'影片附件')+' '+String(index+1).padStart(4,'0'),filename=item.name.replace(/[\r\n"\\]/g,'_');const header=`To: ${email}\r\nSubject: =?UTF-8?B?${b64utf8(subject)}?=\r\nMIME-Version: 1.0\r\nContent-Type: multipart/mixed; boundary="${boundary}"\r\n\r\n--${boundary}\r\nContent-Type: text/plain; charset=UTF-8\r\nContent-Transfer-Encoding: base64\r\n\r\n${b64utf8('影片附件：'+filename)}\r\n--${boundary}\r\nContent-Type: ${item.blob.type||'application/octet-stream'}; name="attachment"\r\nContent-Disposition: attachment; filename="${filename}"\r\nContent-Transfer-Encoding: base64\r\n\r\n`;const bytes=new Uint8Array(await item.blob.arrayBuffer());let attachment='';for(let i=0;i<bytes.length;i+=3*8192){const part=bytes.subarray(i,i+3*8192);let binary='';for(let j=0;j<part.length;j++)binary+=String.fromCharCode(part[j]);attachment+=btoa(binary)}const raw=b64urlBytes(new TextEncoder().encode(header+attachment+`\r\n--${boundary}--\r\n`));const res=await fetch('https://gmail.googleapis.com/gmail/v1/users/me/messages/send',{method:'POST',headers:{Authorization:'Bearer '+token,'Content-Type':'application/json'},body:JSON.stringify({raw})});if(!res.ok){const detail=await res.text();if(res.status===401)token='';throw Error(`Gmail HTTP ${res.status}: ${detail.slice(0,240)}`)}return await res.json()}
async function sendQueue(failedOnly=false){
  if(running)return;
  running=true;stopRequested=false;
  try{
    if(!prepared)throw Error('請先完成影片準備');
    if(!token)throw Error('請先連結 Gmail');
    if(!$('recipient').checkValidity()||!$('recipient').value.trim())throw Error('請輸入正確收件信箱');
    const targets=items.filter(x=>failedOnly?x.state==='failed':x.state==='ready'||x.state==='failed');
    if(!targets.length)throw Error('沒有可寄送附件');
    const concurrency=2;
    let cursor=0,haltReason='',active=0;
    const worker=async()=>{
      while(!stopRequested){
        // JavaScript runs this selection synchronously, preventing duplicate claims.
        if(cursor>=targets.length)return;
        const x=targets[cursor++];
        if(x.state!=='ready'&&x.state!=='failed')continue;
        x.state='sending';x.error='';active++;refresh();
        const idx=items.indexOf(x);
        status(`雙封加速：寄送第 ${idx+1}/${items.length} 段（同時進行 ${active} 封）`);
        const startTime=performance.now();
        try{
          const result=await sendOne(x,idx);
          x.state='sent';x.gmailId=result.id||'';x.error='';
          sentBytes+=x.blob.size;
          log(`寄送成功：${x.name} / ${((performance.now()-startTime)/1000).toFixed(1)}秒 / Gmail ID: ${x.gmailId}`);
        }catch(e){
          x.error=e?.message||String(e);
          const ambiguous=/Failed to fetch|NetworkError|network|timeout|abort/i.test(x.error);
          x.state=ambiguous?'uncertain':'failed';
          status('寄送異常：'+x.name+' — '+x.error);
          if(ambiguous){
            haltReason='網路結果不明：請先查 Gmail 已寄件匣，避免重複寄送';
            stopRequested=true;
          }else if(!token||/Gmail HTTP (401|403|429|5\d\d)\b/.test(x.error)){
            haltReason='Gmail 授權、限流或伺服器錯誤；請稍後確認再重試';
            stopRequested=true;
          }
        }finally{active--;refresh()}
      }
    };
    await Promise.all(Array.from({length:Math.min(concurrency,targets.length)},()=>worker()));
    if(haltReason)status(haltReason);
    else if(stopRequested)status('已暫停；已啟動的郵件已完成，未寄項目保留');
    else status('本輪處理結束；已確認成功 '+items.filter(x=>x.state==='sent').length+' / '+items.length+' 段');
  }catch(e){status(e?.message||String(e))}
  finally{running=false;refresh()}
}
$('send').onclick=()=>sendQueue(false);$('retry').onclick=()=>sendQueue(true);
$('export').onclick=()=>{const content='大量發送小工具寄送紀錄\n'+new Date().toLocaleString('zh-TW')+'\n'+logs.join('\n')+'\n\n'+items.map(x=>`${x.name}\t${x.state}\t${x.gmailId||''}\t${x.error||''}`).join('\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([content],{type:'text/plain;charset=utf-8'}));a.download='gmail-v448-log.txt';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),2000)};
$('recipient').value=localStorage.getItem('v44_recipient')||'';$('recipient').addEventListener('change',()=>localStorage.setItem('v44_recipient',$('recipient').value));refresh();
</script></body></html>
