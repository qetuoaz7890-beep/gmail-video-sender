async function prepare() {

    const files = Array.from($('files').files);
    batchPlan=null;

    status('正在確認所選影片可讀取…'); await selectionReady; checkStop();
    items = []; prepared = false; prepProgress = {index:0,total:files.length}; refresh();
    const largeFiles=files.filter(f=>f.size>BATCH_THRESHOLD);

    if(largeFiles.length){
      if(files.length!==1) throw Error('超過 1 GB 的影片請一次選擇一部，完成後再選其他影片，完成後再選其他影片');

      batchPlan={file,position:0,window:300,pendingEnd:null,duration:null,done:false};
      prepared=true; status('影片超過 1 GB，已自動啟用分批模式：連結 Gmail 後按「開始寄送」，每批約 5 分鐘');
      return;

    log('【一般模式】影片未超過 1GB，沿用原本的完整分割流程');
    for (let i = 0; i < files.length; i++) {
      checkStop(); prepProgress.index = i;
      const file = files[i], input = inputCopies.get(file) || file;
      status(`處理 ${i+1}/${files.length}：${file.name}`);

}
$('prepare').onclick=prepare;$('stop').onclick=()=>{stopRequested=true;status('已要求暫停；等待目前操作完成…')};
function b64utf8(s){return btoa(unescape(encodeURIComponent(s)))}
function b64urlBytes(bytes){let s='';for(let i=0;i<bytes.length;i+=32768)s+=String.fromCharCode(...bytes.subarray(i,i+32768));return btoa(s).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'')}
async function sendOne(item,index){const boundary='v448_'+Date.now()+'_'+index,email=$('recipient').value.trim(),subject=($('subject').value.trim()||'影片附件')+' '+(index+1)+'/'+items.length,filename=item.name.replace(/[\r\n"\\]/g,'_');const header=`To: ${email}\r\nSubject: =?UTF-8?B?${b64utf8(subject)}?=\r\nMIME-Version: 1.0\r\nContent-Type: multipart/mixed; boundary="${boundary}"\r\n\r\n--${boundary}\r\nContent-Type: text/plain; charset=UTF-8\r\nContent-Transfer-Encoding: base64\r\n\r\n${b64utf8('影片附件：'+filename)}\r\n--${boundary}\r\nContent-Type: ${item.blob.type||'application/octet-stream'}; name="attachment"\r\nContent-Disposition: attachment; filename="${filename}"\r\nContent-Transfer-Encoding: base64\r\n\r\n`;const bytes=new Uint8Array(await item.blob.arrayBuffer());let attachment='';for(let i=0;i<bytes.length;i+=3*8192){const part=bytes.subarray(i,i+3*8192);let binary='';for(let j=0;j<part.length;j++)binary+=String.fromCharCode(part[j]);attachment+=btoa(binary)}const raw=b64urlBytes(new TextEncoder().encode(header+attachment+`\r\n--${boundary}--\r\n`));const res=await fetch('https://gmail.googleapis.com/gmail/v1/users/me/messages/send',{method:'POST',headers:{Authorization:'Bearer '+token,'Content-Type':'application/json'},body:JSON.stringify({raw})});if(!res.ok){const detail=await res.text();if(res.status===401)token='';throw Error(`Gmail HTTP ${res.status}: ${detail.slice(0,240)}`)}return await res.json()}
async function sendQueue(failedOnly=false){
  if(running)return;
  setBusy(true);
  try{
    if(!prepared)throw Error('請先完成影片準備');
    if(!token)throw Error('請先連結 Gmail');
    if(!$('recipient').checkValidity()||!$('recipient').value.trim())throw Error('請輸入正確收件信箱');
    const targets=items.filter(x=>failedOnly?x.state==='failed':x.state==='ready'||x.state==='failed');
    if(!targets.length)throw Error('沒有可寄送附件');
    const concurrency=2;
    let cursor=0,haltReason='',active=0;
    const worker=async()=>{
      while(!stopRequested){
        // JavaScript runs this selection synchronously, preventing duplicate claims.
        if(cursor>=targets.length)return;
        const x=targets[cursor++];
        if(x.state!=='ready'&&x.state!=='failed')continue;
        x.state='sending';x.error='';active++;refresh();
        const idx=items.indexOf(x);
        status(`雙封加速：寄送第 ${idx+1}/${items.length} 段（同時進行 ${active} 封）`);

          const result=await sendOne(x,idx);

          x.error=e?.message||String(e);

                    x.state=ambiguous?'uncertain':'failed';
          status('寄送異常：'+x.name+' — '+x.error);

            haltReason='網路結果不明：請先查 Gmail 已寄件匣，避免重複寄送';
            stopRequested=true;
          }else if(!token||/Gmail HTTP (401|403|429|5\d\d)\b/.test(x.error)){
            haltReason='Gmail 授權、限流或伺服器錯誤；請稍後確認再重試';
            stopRequested=true;
          }

}
async function sendBatchQueue(){
  if(batchRunning||running)return;
  if(!batchPlan){stopRequested=false;await sendQueue(false);return;}
  if(!prepared){status('請先按「影片分割」建立分批計畫');return;}
  if(!token){status('請先連結 Gmail');return;}
  if(items.some(x=>x.state==='uncertain')){status('有寄送結果不明的附件，請先檢查 Gmail 已寄件匣，避免重複寄送');return;}

      }

        log(`【分批寄送】待寄 ${unresolved.length} 封，最多同時兩封`);
        await sendQueue(false);

      plan.pendingEnd=Math.min(start+plan.window,plan.duration);
      for(const part of parts){
        part.name=String(items.length+1).padStart(4,'0')+(part.name.match(/\.[^.]+$/)?.[0]||'');
        part.size=part.blob.size;
        items.push(part);
      }
      refresh();
      log(`【本批分割完成】${parts.length} 段，現在開始寄送；下一批須等本批全部成功`);
    }
    if(plan.done){
      status(`【大型影片全部完成】已確認寄出 ${items.filter(x=>x.state==='sent').length} 封`);
      batchPlan=null;
    }else if(stopRequested){status('【分批已暫停】進度已保留在此分頁，請勿重新整理');}
