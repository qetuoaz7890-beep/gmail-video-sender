<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>大量發送小工具</title>
  <style>
    :root {
      font-family: system-ui, -apple-system, "Noto Sans TC", sans-serif;
      color-scheme: dark;
      color: #eaf0ff;
      background: #0b1220;
    }
    * { box-sizing: border-box; }
    body { margin: 0; padding: 16px; }
    main { max-width: 660px; margin: 0 auto; }
    h1 { margin: 8px 0 18px; font-size: 1.5rem; }
    h2 { margin: 0 0 10px; font-size: 1.1rem; }
    h3 { font-size: 1rem; margin: 0 0 6px; }
    p { margin: 8px 0; }
    [hidden] { display: none !important; }
    .panel {
      padding: 16px;
      margin: 12px 0;
      background: #17243a;
      border: 1px solid #344862;
      border-radius: 14px;
    }
    .muted { color: #b2c0d8; font-size: .9rem; }
    .notice { color: #ffdc95; overflow-wrap: anywhere; }
    .row { display: flex; align-items: center; gap: 8px 12px; flex-wrap: wrap; }
    .between { justify-content: space-between; }
    .recipient { overflow-wrap: anywhere; }
    label { display: block; margin: 12px 0 4px; font-weight: 650; }
    input:not([type=file]), select {
      width: 100%;
      padding: 10px;
      border: 1px solid #536683;
      border-radius: 8px;
      background: #0d192d;
      color: #fff;
      font-size: 16px;
    }
    fieldset { min-width: 0; padding: 0; margin: 0; border: 0; }
    #files {
      width: 100%;
      padding: 5px;
      border: 1px solid #536683;
      border-radius: 8px;
      background: #0d192d;
      color: #eaf0ff;
      font: inherit;
    }
    #files::file-selector-button {
      min-height: 44px;
      margin-inline-end: 10px;
      padding: 8px 12px;
      border: 0;
      border-radius: 6px;
      background: #344963;
      color: #fff;
      font: inherit;
      font-weight: 700;
    }
    #files:enabled::file-selector-button { cursor: pointer; }
    #files:disabled { opacity: .45; }
    button {
      min-height: 44px;
      padding: 10px 14px;
      border: 0;
      border-radius: 8px;
      background: #64b6ff;
      color: #071426;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
    }
    button.secondary { background: #344963; color: #fff; }
    button.warn { background: #ffce74; }
    button:disabled { opacity: .45; cursor: default; }
    button:focus-visible, #files:focus-visible, select:focus-visible, summary:focus-visible {
      outline: 2px solid #a1d4ff;
      outline-offset: 3px;
    }
    #start { flex: 1 1 12em; }
    summary { cursor: pointer; padding: 8px 0; font-weight: 650; }
    .stack { margin-top: 12px; }
    progress { width: 100%; height: 12px; accent-color: #64b6ff; }
    #progressText { margin-bottom: 4px; font-weight: 700; }
    #fileList {
      list-style: none;
      padding: 0;
      max-height: 224px;
      overflow: auto;
      overscroll-behavior: contain;
    }
    #fileList li {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 4px 0;
      border-bottom: 1px solid #344862;
    }
    .file-name { min-width: 0; overflow-wrap: anywhere; }
    #fileList button { flex-shrink: 0; }
    #issueList { padding-left: 20px; margin: 6px 0 12px; overflow-wrap: anywhere; }
    #issueList li { margin-bottom: 5px; }
    .issue-actions { margin: 8px 0 12px; }
    pre {
      padding: 10px;
      border-radius: 8px;
      overflow: auto;
      max-height: 230px;
      margin: 6px 0 12px;
      background: #091426;
      font-size: 12px;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      overscroll-behavior: contain;
      contain: content;
    }
  </style>
</head>
<body>
<main>
  <h1>大量發送小工具</h1>

  <section class="panel" aria-label="收件人與 Gmail">
    <div class="row between">
      <div>
        <div class="muted">收件人</div>
        <strong id="recipientText" class="recipient">尚未設定</strong>
        <div id="authState" class="muted">Gmail 尚未連線</div>
      </div>
      <button type="button" id="login" class="secondary" disabled>連結 Gmail</button>
    </div>
    <details id="settings">
      <summary>設定</summary>
      <label for="recipient">收件人 Email</label>
      <input id="recipient" type="email" placeholder="name@company.com" required>
      <label for="subject">信件主旨前綴</label>
      <input id="subject" value="影片附件">
      <div class="row stack">
        <button type="button" id="prepareOnly" class="secondary" disabled>先看封數與總容量</button>
        <button type="button" id="testCore" class="secondary" disabled>檢查 FFmpeg 核心</button>
        <button type="button" id="logout" class="secondary" hidden>中斷 Gmail 連線</button>
      </div>
      <div id="preparedPreview" hidden>
        <label for="preparedAttachment">選擇已準備的附件</label>
        <select id="preparedAttachment"></select>
        <button type="button" id="downloadPrepared" class="secondary stack">下載選取的附件</button>
      </div>
    </details>
  </section>

  <section class="panel" aria-labelledby="filesHeading">
    <h2 id="filesHeading">影片</h2>
    <fieldset id="fileControls">
      <input id="files" type="file" accept="video/*" multiple
             aria-label="選擇或加選影片" aria-describedby="fileCount">
      <p id="fileCount" class="muted">已選 0／130 部</p>
      <ul id="fileList" hidden></ul>
    </fieldset>
    <p class="muted">超過 19 MiB 自動分割。每封一段，附件從 0001 依序命名。</p>
  </section>

  <section class="panel" aria-labelledby="sendHeading">
    <h2 id="sendHeading">發送</h2>
    <div id="progressText">尚未開始</div>
    <progress id="progress" max="100" value="0" aria-label="本批處理進度"></progress>
    <p id="status" class="notice" role="status">工具尚未啟動。若重新整理後仍顯示此訊息，請重新上傳完整的 index.html。</p>
    <p id="sentSize" class="muted" hidden></p>
    <div class="row stack">
      <button type="button" id="start" disabled>開始發送</button>
      <button type="button" id="stop" class="warn" hidden>暫停</button>
      <button type="button" id="startOver" class="secondary" hidden>新批次</button>
    </div>
    <div id="issues" class="stack" hidden>
      <h3>需要處理</h3>
      <ul id="issueList"></ul>
      <div class="row">
        <button type="button" id="sendReady" class="secondary" hidden>只寄已準備的影片</button>
        <button type="button" id="retry" class="secondary" hidden>重試寄送失敗的附件</button>
      </div>
    </div>
    <details id="records" class="stack">
      <summary>詳細紀錄</summary>
      <p class="muted">請保持分頁開啟。重新整理或關閉分頁會清除未寄送佇列。已寄容量以附件大小計算。</p>
      <pre id="queueInfo">目前沒有佇列</pre>
      <pre id="log">等待操作…</pre>
    </details>
  </section>
</main>
<script>
'use strict';

const OAUTH_CLIENT_ID='612458875877-1ollgc131numte9m68512cotu26b2qri.apps.googleusercontent.com';

const $ = id => document.getElementById(id);
const MB = 1024 * 1024;
const MAX = 19 * MB;
const FILE_LIMIT = 130;
const GMAIL_SCOPE = 'https://www.googleapis.com/auth/gmail.send';
const GMAIL_SEND_URL = 'https://gmail.googleapis.com/gmail/v1/users/me/messages/send';
const GMAIL_UPLOAD_URL = 'https://gmail.googleapis.com/upload/gmail/v1/users/me/messages/send?uploadType=resumable';
const MESSAGE_MIME_TYPE = 'message/rfc822';
const UPLOAD_CHUNK_SIZE = 4 * MB;
const UPLOAD_RETRIES = 4;
const sleep = ms => new Promise(resolve => setTimeout(resolve, ms));

let token = '';
let authPending = false;
let gisReady = false;
let gisError = '';
let ffmpeg = null;
let loadingFFmpeg = null;
let sources = [];
let items = [];
let previewAttachments = [];
let batch = null;
let phase = '';
let stopRequested = false;
let refreshTimer = 0;
let lastIssues = '';
const logs = [];
const busy = () => !!phase || authPending;
const errorMessage = error => error?.message || String(error);

function log(message) {
  const time = new Date().toLocaleTimeString('zh-TW', {hour12: false});
  logs.push(`[${time}] ${message}`);
  if (logs.length > 200) logs.shift();
  refresh();
}

function status(message) {
  $('status').textContent = message;
  log(message);
}

function refresh() {
  if (!refreshTimer) refreshTimer = setTimeout(render, 160);
}
  function updateRecord(id, text) {
  const element = $(id);
  if (element.textContent === text) return;
  const atBottom = element.scrollHeight - element.scrollTop - element.clientHeight < 45;
  element.textContent = text;
  if (atBottom) element.scrollTop = element.scrollHeight;
}

function render() {
  clearTimeout(refreshTimer);
  refreshTimer = 0;
  const counts = {ready: 0, sending: 0, sent: 0, failed: 0, uncertain: 0};
  let sentBytes = 0;
  for (const item of items) {
    counts[item.state]++;
    if (item.state === 'sent') sentBytes += item.blob.size;
  }
  const preparedSources = sources.filter(source => source.parts).length;
  const preparedParts = sources.reduce((sum, source) => sum + (source.parts?.length || 0), 0);
  const sourceIssues = sources.filter(source => source.problem);
  const locked = busy();
  const runningBatch = phase === 'preparing' || phase === 'sending';
  const canSendSubset = !batch && sourceIssues.length && preparedParts;

  $('recipientText').textContent = (batch?.email || $('recipient').value.trim()) || '尚未設定';
  $('authState').textContent = token ? 'Gmail 已連線' : authPending ? '正在連結 Gmail' : 'Gmail 尚未連線';
  $('login').hidden = !!token;
  $('login').disabled = locked;
  $('logout').hidden = !token;
  $('logout').disabled = locked;
  $('testCore').disabled = locked;
  $('prepareOnly').disabled = locked || !!batch || !sources.length;
  $('preparedPreview').hidden = !!batch || !previewAttachments.length;
  $('preparedAttachment').disabled = locked;
  $('downloadPrepared').disabled = locked;
  $('recipient').disabled = locked || !!batch;
  $('subject').disabled = locked || !!batch;

  $('fileControls').disabled = !!phase || !!batch;
  $('fileCount').textContent = `已選 ${sources.length}／${FILE_LIMIT} 部`;
  $('start').hidden = !!batch && counts.ready === 0 && phase !== 'sending';
  $('start').disabled = locked || !sources.length;
  $('start').textContent =
    batch ? '繼續發送' : sourceIssues.length ? '重試分割並發送' : '開始發送';
  $('stop').hidden = !runningBatch;
  $('stop').disabled = stopRequested;
  $('stop').textContent = stopRequested ? '暫停中…' : '暫停';
  $('startOver').hidden = !batch || locked;
  $('sendReady').hidden = !canSendSubset || locked;
  $('sendReady').textContent = `只寄已準備的 ${preparedParts} 封`;
  $('retry').hidden = !counts.failed || locked;
  $('retry').textContent = `重試失敗的 ${counts.failed} 封`;

  let progressText = sources.length ? '等待開始' : '尚未開始';
  let progress = 0;
  if (items.length) {
    const states = [];
    if (counts.sending) states.push(`寄送中 ${counts.sending}`);
    if (counts.ready) states.push(`待寄 ${counts.ready}`);
    if (counts.failed) states.push(`失敗 ${counts.failed}`);
    if (counts.uncertain) states.push(`待核對 ${counts.uncertain}`);
    progressText = [`Gmail 已寄 ${counts.sent}／${items.length} 封`, ...states].join(' ・ ');
    progress = counts.sent / items.length * 100;
  } else if (phase === 'preparing' || preparedSources) {
    progressText = `已準備 ${preparedSources}／${sources.length} 部`;
    progress = preparedSources / sources.length * 100;
  }
  $('progressText').textContent = progressText;
  $('progress').value = progress;
  $('sentSize').hidden = !counts.sent;
  $('sentSize').textContent = `已寄附件 ${(sentBytes / MB).toFixed(1)} MiB`;

  const issues = sourceIssues.map(source => ({text: `${source.file.name} — ${source.problem}`}));
  for (const [index, item] of items.entries()) {
    const label = `${item.name}（${item.originalName}）`;
    if (item.state === 'failed') issues.push({text: `${label} — ${item.error}`});
    if (item.state === 'uncertain') {
      issues.push({text: `${label} — 請到 Gmail 寄件備份核對本批的「${attachmentSubject(index)}」`, index});
    }
  }
  const issueKey = JSON.stringify([issues, locked && counts.uncertain > 0]);
  $('issues').hidden = !issues.length;
  if (issueKey !== lastIssues) {
    lastIssues = issueKey;
    $('issueList').replaceChildren(...issues.map(({text, index}) => {
      const li = document.createElement('li');
      li.textContent = text;
      if (index !== undefined) {
        const item = items[index];
        const actions = document.createElement('div');
        actions.className = 'row issue-actions';
        for (const [label, handleClick] of [
          ['標記已寄', () => markUncertainAsSent(item)],
          ['補寄這封', () => resendUncertain(item)]
        ]) {
          const button = document.createElement('button');
          button.type = 'button';
          button.className = 'secondary';
          button.textContent = label;
          button.setAttribute('aria-label', `${label} ${item.name}`);
          button.disabled = locked;
          button.onclick = handleClick;
          actions.append(button);
        }
        li.append(actions);
      }
      return li;
    }));
  }

  if ($('records').open) {
    const stateLabels = {ready: '待寄', sending: '寄送中', sent: '已寄', failed: '失敗', uncertain: '待核對'};
    const begin = Math.max(0, items.length - 100);
    const queue = items.slice(begin).map(item => {
      let label = stateLabels[item.state];
      if (item.upload && item.state === 'ready') label = '待續傳';
      if (item.upload && item.state === 'sending') {
        const percent = Math.floor(item.upload.offset / item.upload.message.size * 100);
        label = percent === 100 ? '已上傳，等待 Gmail 確認' : `上傳中 ${percent}%`;
      }
      return `${item.name} — ${(item.blob.size / MB).toFixed(2)} MiB — ${label}`;
    });
    if (begin) queue.unshift(`顯示最後 100 段，前 ${begin} 段仍在佇列。`);
    updateRecord('queueInfo', queue.join('\n') || '目前沒有佇列');
    updateRecord('log', logs.join('\n') || '等待操作…');
  }
}

function renderFiles() {
  const list = $('fileList');
  list.hidden = !sources.length;
  list.replaceChildren(...sources.map(({file}, index) => {
    const row = document.createElement('li');
    const name = document.createElement('span');
    name.className = 'file-name';
    name.textContent = `${file.name} · ${(file.size / MB).toFixed(1)} MiB`;
    const remove = document.createElement('button');
    remove.type = 'button';
    remove.className = 'secondary';
    remove.dataset.index = index;
    remove.textContent = '移除';
    remove.setAttribute('aria-label', `移除 ${file.name}`);
    row.append(name, remove);
    return row;
  }));
}

const fileInput = $('files');
fileInput.onchange = () => {
  const files = Array.from(fileInput.files);
  if (phase || batch || !files.length) return;
  if (sources.length + files.length > FILE_LIMIT) {
    fileInput.value = '';
    status(`最多可選 ${FILE_LIMIT} 部，目前還能加選 ${FILE_LIMIT - sources.length} 部。`);
    return;
  }
  sources.push(...files.map(file => ({file, parts: null, problem: ''})));
  setPreparedPreview([]);
  renderFiles();
  status(`已選 ${sources.length} 部影片。`);
  render();
};
$('fileList').onclick = event => {
  const remove = event.target.closest('button[data-index]');
  if (!remove || phase || batch) return;
  sources.splice(Number(remove.dataset.index), 1);
  setPreparedPreview([]);
  fileInput.value = '';
  renderFiles();
  status(sources.length ? `已選 ${sources.length} 部影片。` : '請選擇要寄送的影片。');
  render();
};

const gisScript = document.createElement('script');
gisScript.src = 'https://accounts.google.com/gsi/client';
gisScript.async = true;
gisScript.onload = () => {
  gisReady = !!window.google?.accounts?.oauth2;
  log(gisReady ? 'Google 登入元件已就緒' : 'Google 登入元件未初始化');
};
gisScript.onerror = () => {
  gisError = 'Google 登入元件載入失敗，請檢查網路或內容封鎖。';
  log(gisError);
};
document.head.appendChild(gisScript);

function finishAuth(message) {
  authPending = false;
  status(message);
  render();
}

$('login').onclick = () => {
  if (busy()) return;
  if (!gisReady) {
    status(gisError || 'Google 登入元件尚未就緒，請稍後再試。');
    return;
  }
  authPending = true;
  status('正在開啟 Google 授權視窗…');
  render();
  try {
    const client = google.accounts.oauth2.initTokenClient({
      client_id: OAUTH_CLIENT_ID,
      scope: GMAIL_SCOPE,
      callback: response => {
        if (response.error || !response.access_token) {
          finishAuth(`Gmail 授權未完成${response.error ? '：' + response.error : ''}。`);
          return;
        }
        token = response.access_token;
        finishAuth('Gmail 已連線。');
      },
      error_callback: error => finishAuth(`Google 授權視窗未完成（${error.type || '未知原因'}）。`)
    });
    client.requestAccessToken({prompt: 'consent'});
  } catch (error) {
    finishAuth('Gmail 登入無法啟動：' + errorMessage(error));
  }
};
  $('logout').onclick = () => {
  if (busy()) return;
  const previous = token;
  token = '';
  if (previous && gisReady) google.accounts.oauth2.revoke(previous, () => {});
  finishAuth('已中斷 Gmail 連線。');
};

$('testCore').onclick = async () => {
  if (busy()) return;
  phase = 'diagnosing';
  render();
  try {
    await loadFFmpeg();
    status('FFmpeg 核心可用。');
  } catch (error) {
    log('核心診斷：' + errorMessage(error));
  } finally {
    phase = '';
    render();
  }
};

async function prepareSources() {
  for (const [index, source] of sources.entries()) {
    if (stopRequested) return;
    if (source.parts) continue;
    const {file} = source;
    source.problem = '';
    status(`準備第 ${index + 1}／${sources.length} 部：${file.name}`);
    try {
      if (!file.size) throw new Error('檔案是空的');
      source.parts = file.size <= MAX ? [{name: file.name, blob: file}] : await splitVideo(file);
      if (!source.parts.length) throw new Error('沒有產生可寄送的影片片段');
    } catch (error) {
      source.parts = null;
      if (stopRequested) return;
      source.problem = errorMessage(error);
      log(`準備失敗：${file.name} — ${source.problem}`);
    }
    refresh();
  }
}

function readSettings() {
  const recipient = $('recipient');
  if (!recipient.checkValidity() || !recipient.value.trim()) {
    $('settings').open = true;
    recipient.focus();
    recipient.reportValidity();
    throw new Error('請輸入正確的收件人 Email。');
  }
  return {email: recipient.value.trim(), subject: $('subject').value.trim() || '影片附件'};
}

function createItems() {
  return sources.flatMap(source => (source.parts || []).map(part => ({
    originalName: source.file.name,
    name: part.name,
    blob: part.blob,
    state: 'ready',
    error: ''
  }))).map((item, index) => ({...item, name: numberedAttachmentName(item.name, index)}));
}

function setPreparedPreview(attachments) {
  previewAttachments = attachments;
  $('preparedAttachment').replaceChildren(...attachments.map((item, index) => {
    const option = document.createElement('option');
    option.value = String(index);
    option.textContent = `${item.name} · ${(item.blob.size / MB).toFixed(2)} MiB`;
    return option;
  }));
}

function attachmentSubject(index) {
  return `${batch.subject} ${index + 1}/${items.length}`;
}

function bytesToBase64(bytes) {
  let binary = '';
  for (let offset = 0; offset < bytes.length; offset += 16_384) {
    binary += String.fromCharCode(...bytes.subarray(offset, offset + 16_384));
  }
  return btoa(binary);
}

async function buildMessage(item, index) {
  const boundary = 'video_' + Date.now() + '_' + index;
  const subject = attachmentSubject(index);
  const filename = item.name;
  const header = [
    `To: ${batch.email}`,
    `Subject: =?UTF-8?B?${b64utf8(subject)}?=`,
    'MIME-Version: 1.0',
    `Content-Type: multipart/mixed; boundary="${boundary}"`,
    '',
    `--${boundary}`,
    'Content-Type: text/plain; charset=UTF-8',
    'Content-Transfer-Encoding: base64',
    '',
    b64utf8('影片附件：' + filename),
    `--${boundary}`,
    `Content-Type: ${item.blob.type || 'application/octet-stream'}; name="attachment"`,
    `Content-Disposition: attachment; filename="${filename}"`,
    'Content-Transfer-Encoding: base64',
    '',
    ''
  ].join('\r\n');
  const parts = [header];
  // Each 57 input bytes makes one 76-character MIME base64 line.
  const blockSize = 57 * 1024;
  for (let offset = 0; offset < item.blob.size; offset += blockSize) {
    if (stopRequested) throw retryLater('已暫停準備附件。');
    const bytes = new Uint8Array(await item.blob.slice(offset, offset + blockSize).arrayBuffer());
    parts.push(bytesToBase64(bytes).replace(/.{1,76}/g, '$&\r\n'));
  }
  parts.push(`--${boundary}--\r\n`);
  return new Blob(parts, {type: MESSAGE_MIME_TYPE});
}

async function gmailRequest(url, accessToken, {method, headers, body}, timeoutMs) {
  try {
    const response = await fetch(url, {
      method, body,
      headers: {Authorization: 'Bearer ' + accessToken, ...headers},
      signal: AbortSignal.timeout(timeoutMs),
      // Gmail uses 308 without a Location header for incomplete uploads.
      redirect: method === 'PUT' ? 'follow' : 'error'
    });
    return response.redirected && !gmailSessionUrl(response.url) ? null : response;
  } catch {
    return null;
  }
}

const temporaryGmailError = response => !response || response.status === 408 || response.status >= 500;
const gmailNeedsAttention = code => [401, 403, 429].includes(code);
const retryLater = message => Object.assign(new Error(message), {retryLater: true});
const uncertainSend = message => Object.assign(new Error(message), {uncertain: true});
const waitBeforeRetry = attempt => sleep(1000 * 2 ** attempt + Math.random() * 500);

async function gmailHttpError(response) {
  const detail = await response.text().catch(() => '');
  return Object.assign(new Error(`Gmail HTTP ${response.status}: ${detail.slice(0, 240)}`),
    {httpStatus: response.status});
}

function useLegacyUpload(reason) {
  batch.legacyUpload = true;
  status(`${reason}。本批改用相容寄送方式。`);
}

function gmailSessionUrl(locationHeader) {
  if (!locationHeader) return null;
  try {
    const url = new URL(locationHeader, GMAIL_UPLOAD_URL);
    const gmailOrigins = ['https://gmail.googleapis.com', 'https://www.googleapis.com'];
    if (gmailOrigins.includes(url.origin) && !url.username && !url.password &&
        /^\/upload\/gmail\/v1\/users\/[^/]+\/messages\/send$/.test(url.pathname) &&
        url.searchParams.get('upload_id')) return url.href;
  } catch {
    // The caller handles an unavailable upload URL before any attachment is sent.
  }
  return null;
}

async function openGmailUpload(message, accessToken) {
  for (let attempt = 0; attempt <= UPLOAD_RETRIES; attempt++) {
    if (stopRequested || navigator.onLine === false) throw retryLater('續傳連線尚未開啟。');
    const response = await gmailRequest(GMAIL_UPLOAD_URL, accessToken, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json; charset=UTF-8',
        'X-Upload-Content-Type': MESSAGE_MIME_TYPE,
        'X-Upload-Content-Length': String(message.size)
      },
      body: '{}'
    }, 15_000);
    if (response?.ok) {
      const url = gmailSessionUrl(response.headers.get('Location'));
      if (!url) useLegacyUpload('瀏覽器無法取得 Gmail 續傳網址');
      return url;
    }
    if ([400, 404, 405, 415, 501].includes(response?.status)) {
      useLegacyUpload('目前無法啟用 Gmail 續傳');
      return null;
    }
    if (!temporaryGmailError(response)) throw await gmailHttpError(response);
    if (attempt < UPLOAD_RETRIES) {
      await waitBeforeRetry(attempt);
      continue;
    }
    if (response || navigator.onLine === false) {
      throw retryLater('Gmail 續傳連線暫時無法建立。');
    }
    useLegacyUpload('Gmail 續傳連線沒有回覆');
    return null;
  }
}

async function sendLegacyMessage(message, accessToken) {
  if (stopRequested || navigator.onLine === false) throw retryLater('附件尚未開始上傳。');
  const raw = bytesToBase64(new Uint8Array(await message.arrayBuffer()))
    .replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
  if (stopRequested || navigator.onLine === false) throw retryLater('附件尚未開始上傳。');
  const response = await gmailRequest(GMAIL_SEND_URL, accessToken, {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({raw})
  }, 240_000);
  if (temporaryGmailError(response)) throw uncertainSend('連線未取得 Gmail 寄送確認。');
  if (!response.ok) throw await gmailHttpError(response);
  return response;
}

function uploadedBytes(range) {
  if (!range) return 0;
  const match = /^(?:bytes\s*=\s*)?0-(\d+)$/i.exec(range.trim());
  return match ? Number(match[1]) + 1 : NaN;
}
  async function uploadGmailMessage(item, accessToken) {
  const upload = item.upload;
  const total = upload.message.size;
  let retries = 0;
  while (!stopRequested) {
    const offset = upload.offset;
    const checking = upload.checkProgress;
    const initialCheck = !upload.checked;
    const end = Math.min(offset + UPLOAD_CHUNK_SIZE, total);
    const finalChunk = !checking && end === total;
    const response = await gmailRequest(upload.url, accessToken, {
      method: 'PUT',
      headers: {
        'Content-Type': MESSAGE_MIME_TYPE,
        'Content-Range': checking ? `bytes */${total}` : `bytes ${offset}-${end - 1}/${total}`
      },
      body: checking ? undefined : upload.message.slice(offset, end, MESSAGE_MIME_TYPE)
    }, checking ? 15_000 : 120_000);

    if (initialCheck && [200, 201, 400, 405, 415, 501].includes(response?.status)) {
      useLegacyUpload('瀏覽器無法確認 Gmail 續傳進度');
      return null;
    }
    if (response?.status === 200 || response?.status === 201) return response;
    if (response?.status === 308) {
      if (initialCheck) {
        upload.checked = true;
        if (!batch.loggedResumable) {
          batch.loggedResumable = true;
          log('Gmail 續傳已啟用。');
        }
      }
      const range = response.headers.get('Range');
      if (!range && !checking && !finalChunk && !upload.finalUnconfirmed) {
        // This upload cannot have sent an email yet because no final part was attempted.
        useLegacyUpload('瀏覽器無法讀取 Gmail 續傳進度');
        return null;
      }
      const next = uploadedBytes(range);
      if (Number.isSafeInteger(next) && next >= offset && next < total) {
        upload.checkProgress = false;
        if (next > offset) {
          upload.offset = next;
          retries = 0;
          refresh();
          if (checking) log(`${item.name} 已確認上傳進度，接著上傳。`);
          continue;
        }
        if (checking) continue;
      } else {
        upload.checkProgress = true;
        if (next === total) {
          upload.offset = total;
          upload.finalUnconfirmed = true;
        }
      }
    } else if (temporaryGmailError(response)) {
      upload.finalUnconfirmed ||= finalChunk;
      upload.checkProgress = true;
    } else if ([404, 410].includes(response.status)) {
      if (upload.finalUnconfirmed) throw uncertainSend('Gmail 續傳連線已失效，最後一段的寄送結果待核對。');
      return 'expired';
    } else {
      const error = await gmailHttpError(response);
      if (gmailNeedsAttention(response.status)) error.retryLater = true;
      throw error;
    }
    if (stopRequested) break;
    if (retries >= UPLOAD_RETRIES) {
      if (initialCheck && !response && navigator.onLine !== false) {
        // Only empty status requests have been made on this session so far.
        useLegacyUpload('瀏覽器無法確認 Gmail 續傳進度');
        return null;
      }
      break;
    }
    if (retries === 0) log(`${item.name} 上傳暫停，正在向 Gmail 核對進度。`);
    await waitBeforeRetry(retries++);
  }
  throw retryLater('已保留上傳進度，可繼續發送。');
}

async function sendOne(item, index) {
  const accessToken = token;
  const message = item.upload?.message || await buildMessage(item, index);
  for (let attempt = 0; attempt < 2; attempt++) {
    if (item.upload) {
      item.upload.checkProgress = true;
    } else {
      const url = batch.legacyUpload ? null : await openGmailUpload(message, accessToken);
      if (!url) {
        const response = await sendLegacyMessage(message, accessToken);
        return response.json().catch(() => null);
      }
      item.upload = {url, message, offset: 0, checked: false, checkProgress: true, finalUnconfirmed: false};
    }
    const response = await uploadGmailMessage(item, accessToken);
    item.upload = null;
    if (response === 'expired') {
      log(`${item.name} 的上傳連線已過期，重新建立續傳連線。`);
      continue;
    }
    const result = response || await sendLegacyMessage(message, accessToken);
    return result.json().catch(() => null);
  }
  throw retryLater('Gmail 續傳連線已過期，可繼續發送。');
}

function reportBatchStatus() {
  if (items.every(item => item.state === 'sent')) {
    const omitted = sources.filter(source => !source.parts).length;
    status(omitted ? `所選附件已發送。另有 ${omitted} 部影片尚未寄送。` : '本批發送完成。');
  } else if (items.some(item => item.state === 'uncertain')) {
    status('請核對標示為待核對的附件。');
  } else {
    status('本輪寄送結束，可繼續發送或重試失敗附件。');
  }
}

function markUncertainAsSent(item) {
  if (busy() || item.state !== 'uncertain') return;
  item.state = 'sent';
  item.error = '';
  log(`已核對為已寄：${item.name}`);
  reportBatchStatus();
  render();
}

function resendUncertain(item) {
  if (busy() || item.state !== 'uncertain') return;
  if (window.confirm(`已在 Gmail 寄件備份核對過，本批找不到 ${item.name}？確認後只補寄這一封。`)) {
    start({resendItem: item});
  }
}

async function sendQueued(retryFailed, resendItem) {
  const targetState = resendItem ? 'uncertain' : (retryFailed ? 'failed' : 'ready');
  const targets = items.map((item, index) => ({item, index}))
    .filter(({item}) => item.state === targetState && (!resendItem || item === resendItem));
  if (!targets.length) {
    status('沒有可寄送的附件。');
    return;
  }
  let cursor = 0;
  let haltReason = '';
  const worker = async () => {
    while (!stopRequested && cursor < targets.length) {
      const {item, index} = targets[cursor++];
      item.state = 'sending';
      item.error = '';
      refresh();
      const startedAt = performance.now();
      try {
        const result = await sendOne(item, index);
        item.state = 'sent';
        log(`寄送成功：${item.name}／${((performance.now() - startedAt) / 1000).toFixed(1)} 秒${result?.id ? '／Gmail ID: ' + result.id : ''}`);
      } catch (error) {
        const retryable = !!error.retryLater;
        const uncertain = !retryable && (error.uncertain || item.upload?.finalUnconfirmed);
        item.error = errorMessage(error);
        item.state = retryable ? 'ready' : uncertain ? 'uncertain' : 'failed';
        if (!retryable) item.upload = null;
        log(`${retryable ? '寄送暫停' : '寄送異常'}：${item.name} — ${item.error}`);
        if (error.httpStatus === 401) token = '';
        if (uncertain) {
          haltReason = '寄送結果未確認。請到 Gmail 寄件備份核對，再回到「需要處理」。';
          stopRequested = true;
        } else if (gmailNeedsAttention(error.httpStatus)) {
          haltReason ||= error.httpStatus === 401
            ? 'Gmail 授權已失效，請重新連線。'
            : 'Gmail 暫時拒絕寄送，請查看詳細紀錄。';
          stopRequested = true;
        } else if (retryable && !stopRequested) {
          haltReason ||= '寄送暫停。網路恢復後可按「繼續發送」。';
          stopRequested = true;
        }
      } finally {
        refresh();
      }
    }
  };
  status('正在寄送附件…');
  await Promise.all(Array.from({length: Math.min(2, targets.length)}, worker));
  if (haltReason) status(haltReason);
  else if (stopRequested) status('已暫停。待寄及待續傳的附件仍在佇列。');
  else reportBatchStatus();
}

async function start({usePreparedFiles = false, onlyPrepare = false, retryFailed = false, resendItem = null} = {}) {
  if (busy() || !sources.length || (onlyPrepare && batch)) return;
  if (!onlyPrepare && !token) {
    status('請先連結 Gmail。');
    $('login').focus();
    return;
  }
  stopRequested = false;
  try {
    const settings = onlyPrepare ? null : batch || readSettings();
    if (!batch) {
      setPreparedPreview([]);
      phase = 'preparing';
      render();
      if (!usePreparedFiles) await prepareSources();
      if (stopRequested) {
        status('已暫停準備，已完成的影片仍保留。');
        return;
      }
      if (!usePreparedFiles && sources.some(source => source.problem)) {
        status('有影片準備失敗。可以換檔、重試分割，或只寄已準備的影片。');
        return;
      }
      if (onlyPrepare) {
        const attachments = createItems();
        setPreparedPreview(attachments);
        const bytes = attachments.reduce((total, item) => total + item.blob.size, 0);
        status(`已準備 ${attachments.length} 個附件，共 ${(bytes / MB).toFixed(1)} MiB。可以下載單一附件或開始發送。`);
        return;
      }
      items = createItems();
      if (!items.length) throw new Error('沒有可寄送的附件。');
      batch = settings;
    }
    phase = 'sending';
    render();
    await sendQueued(retryFailed, resendItem);
  } catch (error) {
    status(errorMessage(error));
  } finally {
    phase = '';
    render();
  }
  }
  $('start').onclick = () => start();
$('prepareOnly').onclick = () => start({onlyPrepare: true});
$('downloadPrepared').onclick = () => {
  const item = previewAttachments[$('preparedAttachment').value];
  if (busy() || batch || !item) return;
  const url = URL.createObjectURL(item.blob);
  const link = document.createElement('a');
  link.href = url;
  link.download = item.name;
  document.body.append(link);
  link.click();
  link.remove();
  setTimeout(() => URL.revokeObjectURL(url), 30_000);
};
$('sendReady').onclick = () => start({usePreparedFiles: true});
$('retry').onclick = () => start({retryFailed: true});
$('stop').onclick = () => {
  if (phase !== 'preparing' && phase !== 'sending') return;
  stopRequested = true;
  status('正在暫停，請等目前步驟結束。');
  render();
};
$('startOver').onclick = () => {
  if (busy() || !batch) return;
  if ((items.some(item => item.state !== 'sent') || sources.some(source => !source.parts)) &&
      !window.confirm('還有未寄送或待核對的附件。清除這批佇列並開始新批次？')) return;
  sources = [];
  items = [];
  batch = null;
  fileInput.value = '';
  renderFiles();
  status('請選擇要寄送的影片。');
  render();
};

function rememberRecipient() {
  try { localStorage.setItem('v44_recipient', $('recipient').value); } catch (_) {}
  render();
}
try { $('recipient').value = localStorage.getItem('v44_recipient') || ''; } catch (_) {}
$('recipient').oninput = render;
$('recipient').onchange = rememberRecipient;
$('records').ontoggle = render;
$('settings').open = !$('recipient').value;
