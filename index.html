<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Gmail 影片批次寄送系統</title><script src="https://accounts.google.com/gsi/client" async defer></script><style>
*{box-sizing:border-box}body{font-family:system-ui,sans-serif;background:#f1f5f9;color:#172338;margin:0;padding:14px}main{max-width:760px;margin:auto}section{background:#fff;border-radius:13px;padding:17px;margin:13px 0;box-shadow:0 2px 8px #0001}h1{font-size:24px;text-align:center}h2{font-size:18px}input,textarea{width:100%;font:inherit;padding:10px;margin:7px 0;border:1px solid #9aa7b8;border-radius:7px}button{background:#155fc0;color:white;border:0;border-radius:8px;padding:11px;margin:4px;font:inherit}button:disabled{opacity:.45}.secondary{background:#56667a}.warning{background:#a84030}.muted{color:#5b6879;font-size:14px}.notice{white-space:pre-wrap;background:#eaf0f8;padding:12px;border-radius:8px;overflow-wrap:anywhere}progress{width:100%;height:18px}li{padding:7px 0;overflow-wrap:anywhere}.sent{color:#087a32}.failed{color:#ad2525}.missing{color:#ad2525}label{display:block;margin-top:10px}
</style></head><body><main><h1>📨 Gmail 影片批次寄送系統</h1><section><h2>① Gmail 授權</h2><button id="login">登入 Gmail</button><button id="logout" class="secondary">解除授權</button><div id="auth" class="notice">尚未登入</div></section><section><h2>② 郵件設定</h2><label>收件者<input id="to" type="email" placeholder="recipient@example.com"></label><label>主旨<input id="subject" value="影片資料"></label><label>內容<textarea id="message" rows="3">您好，附件為影片，請查收。</textarea></label></section><section><h2>③ 選取影片</h2><input id="files" type="file" accept="video/*" multiple><p class="muted">最多 130 部，每部小於 20,000,000 bytes。建議從「檔案」→「內部儲存空間」選取，不要從相簿的雲端或暫存項目選取。</p><button id="check" class="secondary">檢查全部影片是否可讀</button><p id="count" class="notice">尚未選取</p><h2>重新選取失敗影片</h2><input id="replacement" type="file" accept="video/*" multiple><p class="muted">選擇與失敗項目「檔名相同、大小相同」的影片。成功項目不會重寄。</p></section><section><h2>④ 寄送</h2><button id="send">寄送未完成項目</button><button id="retry" class="secondary">重試失敗項目</button><button id="stop" class="warning">停止</button><progress id="progress" value="0" max="1"></progress><div id="summary" class="notice"></div><ol id="results"></ol></section><section><h2>注意</h2><p class="muted">這是前端寄送工具，瀏覽器必須持續開啟。若網路在寄送後斷線，可能無法確認是否成功；重試前先檢查 Gmail「寄件備份」。頁面重新整理後需重新選取影片。寄送量受 Gmail 限制。</p></section></main><script>
'use strict';
const CLIENT_ID='612458875877-1ollgc131numte9m68512cotu26b2qri.apps.googleusercontent.com';
const SCOPE='https://www.googleapis.com/auth/gmail.send';
const $=id=>document.getElementById(id);
let token='',oauth=null,jobs=[],running=false,stopRequested=false;
const MAX=130,LIMIT=20000000;
function auth(s){$('auth').textContent=s}
function init(){if(!window.google?.accounts?.oauth2){auth('Google 授權程式尚未載入，請稍後重試');return false}if(!oauth)oauth=google.accounts.oauth2.initTokenClient({client_id:CLIENT_ID,scope:SCOPE,callback:r=>{if(r.error){auth('授權失敗：'+r.error);return}token=r.access_token;auth('已取得 Gmail 寄送授權')}});return true}
$('login').onclick=()=>{if(init())oauth.requestAccessToken({prompt:'consent'})};
$('logout').onclick=()=>{if(token&&window.google?.accounts?.oauth2)google.accounts.oauth2.revoke(token,()=>{});token='';auth('已解除授權')};
function render(){const sent=jobs.filter(j=>j.state==='sent').length,failed=jobs.filter(j=>j.state==='failed'||j.state==='needs-file'||j.state==='uncertain').length;const done=sent+failed;$('progress').max=Math.max(1,jobs.length);$('progress').value=done;$('count').textContent=`已選 ${jobs.length} 部；可讀性檢查需按「檢查全部影片」`;$('summary').textContent=`總數：${jobs.length}\n成功：${sent}\n待處理：${jobs.filter(j=>j.state==='pending').length}\n失敗／待確認：${failed}\n目前：${running?'處理中':'待命'}`;const ul=$('results');ul.replaceChildren();for(const j of jobs){const li=document.createElement('li');li.className=j.state;li.textContent=`${j.n}. ${j.name} — ${j.state}${j.message?'：'+j.message:''}${j.gmailId?'（Gmail ID: '+j.gmailId+'）':''}`;ul.append(li)}}
$('files').onchange=()=>{if(running)return;const arr=[...$('files').files];if(arr.length>MAX){alert('最多130部');return}jobs=arr.map((file,i)=>({file,n:i+1,name:file.name,size:file.size,state:'pending',message:'',gmailId:''}));for(const j of jobs)if(j.size>=LIMIT){j.state='failed';j.message='檔案大於或等於20MB'}render()};
function isFileError(e){return e?.name==='NotFoundError'||e?.name==='NotReadableError'||/file or directory could not be found|could not be read|not found at the time|not readable/i.test(String(e?.message||''))}
async function readFile(j){if(!j.file)throw new DOMException('請重新選取原始影片','NotFoundError');const bytes=new Uint8Array(await j.file.arrayBuffer());if(bytes.length!==j.size)throw Error('檔案大小與讀取結果不符');return bytes}
$('check').onclick=async()=>{if(running||!jobs.length)return;running=true;try{for(const j of jobs){if(j.state==='sent'||j.size>=LIMIT)continue;try{const bytes=await readFile(j);j.state='pending';j.message=`可讀 (${bytes.length} bytes)`}catch(e){j.state='needs-file';j.message='檔案無法讀取，請從內部儲存空間重新選取：'+e.message}render()}}finally{running=false;render()}};
$('replacement').onchange=()=>{if(running)return;let replaced=0;for(const f of $('replacement').files){const j=jobs.find(x=>x.state!=='sent'&&x.name===f.name&&x.size===f.size);if(j){j.file=f;j.state='pending';j.message='已重新選取，待檢查';replaced++}}$('replacement').value='';render();alert(`已重新連結 ${replaced} 部影片。請先按「檢查全部影片是否可讀」。`)};
function base64(bytes){let s='';for(let i=0;i<bytes.length;i+=8192)s+=String.fromCharCode(...bytes.subarray(i,i+8192));return btoa(s)}
const utf8=s=>new TextEncoder().encode(s);
const header=s=>'=?UTF-8?B?'+base64(utf8(s))+'?=';
const url64=bytes=>base64(bytes).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
function wrap64(s){return s.match(/.{1,76}/g)?.join('\r\n')||''}
function makeMime(j,bytes){const boundary='video_'+Date.now()+'_'+j.n;const filename=j.name.replace(/[\r\n"\\]/g,'_');const subject=$('subject').value+` (${j.n}/${jobs.length})`;const text=$('message').value;const lines=[`To: ${$('to').value.trim()}`,`Subject: ${header(subject)}`,'MIME-Version: 1.0',`Content-Type: multipart/mixed; boundary="${boundary}"`,'',`--${boundary}`,'Content-Type: text/plain; charset=UTF-8','Content-Transfer-Encoding: base64','',wrap64(base64(utf8(text))),`--${boundary}`,'Content-Type: application/octet-stream',`Content-Disposition: attachment; filename="${header(filename)}"`,'Content-Transfer-Encoding: base64','',wrap64(base64(bytes)),`--${boundary}--`,''];const mime=utf8(lines.join('\r\n'));if(mime.length>25000000)throw Error('郵件編碼後超過25MB');return url64(mime)}
async function sendOne(j){const bytes=await readFile(j);const raw=makeMime(j,bytes);const res=await fetch('https://gmail.googleapis.com/gmail/v1/users/me/messages/send',{method:'POST',headers:{Authorization:'Bearer '+token,'Content-Type':'application/json'},body:JSON.stringify({raw})});let data={};try{data=await res.json()}catch{}if(!res.ok){const e=Error(data.error?.message||`HTTP ${res.status}`);e.httpStatus=res.status;throw e}if(!data.id)throw Error('API 未回傳郵件 ID，請檢查寄件備份');return data.id}
async function run(retry){if(running)return;if(!token){alert('請先登入 Gmail');return}if(!$('to').checkValidity()||!$('to').value.trim()){alert('請填寫正確收件者');return}const targets=jobs.filter(j=>retry?j.state==='failed':j.state==='pending');if(!targets.length){alert('沒有可寄送的項目；檔案遺失請先重新選取');return}if(!confirm(`將寄送 ${targets.length} 封至 ${$('to').value}。請先確認寄件備份沒有重複郵件，繼續嗎？`))return;running=true;stopRequested=false;render();try{for(const j of targets){if(stopRequested||!token)break;j.state='sending';j.message='';render();try{j.gmailId=await sendOne(j);j.state='sent';j.message='寄送 API 已接受'}catch(e){if(isFileError(e)){j.state='needs-file';j.message='來源檔案已無法讀取，批次已暫停；請重新選取';stopRequested=true}else if(e.httpStatus===401){j.state='failed';j.message='授權過期，請重新登入';token='';stopRequested=true}else if(e.httpStatus===429||e.httpStatus===403){j.state='failed';j.message='Gmail 限制：'+e.message+'；請稍後再試';stopRequested=true}else if(!e.httpStatus&&/Failed to fetch|NetworkError|API 未回傳郵件 ID/i.test(e.message)){j.state='uncertain';j.message='寄送結果不確定，請先查看 Gmail 寄件備份';stopRequested=true}else{j.state='failed';j.message=e.message}}render();if(!stopRequested)await new Promise(r=>setTimeout(r,2000))}}finally{running=false;render()}}
$('send').onclick=()=>run(false);$('retry').onclick=()=>run(true);$('stop').onclick=()=>{stopRequested=true;alert('已要求停止，正在處理的郵件可能仍會寄出')};render();
</script></body></html>
