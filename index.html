<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>大量發送小工具</title>
  <style>
    :root {
      font-family: system-ui, -apple-system, "Noto Sans TC", sans-serif;
      color-scheme: dark;
      color: #eaf0ff;
      background: #0b1220;
    }
    * { box-sizing: border-box; }
    body { margin: 0; padding: 16px; }
    main { max-width: 660px; margin: 0 auto; }
    h1 { margin: 8px 0 18px; font-size: 1.5rem; }
    h2 { margin: 0 0 10px; font-size: 1.1rem; }
    h3 { font-size: 1rem; margin: 0 0 6px; }
    p { margin: 8px 0; }
    [hidden] { display: none !important; }
    .panel {
      padding: 16px;
      margin: 12px 0;
      background: #17243a;
      border: 1px solid #344862;
      border-radius: 14px;
    }
    .muted { color: #b2c0d8; font-size: .9rem; }
    .notice { color: #ffdc95; overflow-wrap: anywhere; }
    .row { display: flex; align-items: center; gap: 8px 12px; flex-wrap: wrap; }
    .between { justify-content: space-between; }
    .recipient { overflow-wrap: anywhere; }
    label { display: block; margin: 12px 0 4px; font-weight: 650; }
    input:not([type=file]) {
      width: 100%;
      padding: 10px;
      border: 1px solid #536683;
      border-radius: 8px;
      background: #0d192d;
      color: #fff;
      font-size: 16px;
    }
    fieldset { min-width: 0; padding: 0; margin: 0; border: 0; }
    #files {
      width: 100%;
      padding: 5px;
      border: 1px solid #536683;
      border-radius: 8px;
      background: #0d192d;
      color: #eaf0ff;
      font: inherit;
    }
    #files::file-selector-button {
      min-height: 44px;
      margin-inline-end: 10px;
      padding: 8px 12px;
      border: 0;
      border-radius: 6px;
      background: #344963;
      color: #fff;
      font: inherit;
      font-weight: 700;
    }
    #files:enabled::file-selector-button { cursor: pointer; }
    #files:disabled { opacity: .45; }
    button {
      min-height: 44px;
      padding: 10px 14px;
      border: 0;
      border-radius: 8px;
      background: #64b6ff;
      color: #071426;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
    }
    button.secondary { background: #344963; color: #fff; }
    button.warn { background: #ffce74; }
    button:disabled { opacity: .45; cursor: default; }
    button:focus-visible, #files:focus-visible, summary:focus-visible {
      outline: 2px solid #a1d4ff;
      outline-offset: 3px;
    }
    #start { flex: 1 1 12em; }
    summary { cursor: pointer; padding: 8px 0; font-weight: 650; }
    .stack { margin-top: 12px; }
    progress { width: 100%; height: 12px; accent-color: #64b6ff; }
    #progressText { margin-bottom: 4px; font-weight: 700; }
    #fileList {
      list-style: none;
      padding: 0;
      max-height: 224px;
      overflow: auto;
      overscroll-behavior: contain;
    }
    #fileList li {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 4px 0;
      border-bottom: 1px solid #344862;
    }
    .file-name { min-width: 0; overflow-wrap: anywhere; }
    #fileList button { flex-shrink: 0; }
    #issueList { padding-left: 20px; margin: 6px 0 12px; overflow-wrap: anywhere; }
    #issueList li { margin-bottom: 5px; }
    pre {
      padding: 10px;
      border-radius: 8px;
      overflow: auto;
      max-height: 230px;
      margin: 6px 0 12px;
      background: #091426;
      font-size: 12px;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      overscroll-behavior: contain;
      contain: content;
    }
  </style>
</head>
<body>
<main>
  <h1>大量發送小工具</h1>

  <section class="panel" aria-label="收件人與 Gmail">
    <div class="row between">
      <div>
        <div class="muted">收件人</div>
        <strong id="recipientText" class="recipient">尚未設定</strong>
        <div id="authState" class="muted">Gmail 尚未連線</div>
      </div>
      <button type="button" id="login" class="secondary" disabled>連結 Gmail</button>
    </div>
    <details id="settings">
      <summary>設定</summary>
      <label for="recipient">收件人 Email</label>
      <input id="recipient" type="email" placeholder="name@company.com" required>
      <label for="subject">信件主旨前綴</label>
      <input id="subject" value="影片附件">
      <div class="row stack">
        <button type="button" id="prepareOnly" class="secondary" disabled>先看封數與總容量</button>
        <button type="button" id="testCore" class="secondary" disabled>檢查 FFmpeg 核心</button>
        <button type="button" id="logout" class="secondary" hidden>中斷 Gmail 連線</button>
      </div>
    </details>
  </section>

  <section class="panel" aria-labelledby="filesHeading">
    <h2 id="filesHeading">影片</h2>
    <fieldset id="fileControls">
      <input id="files" type="file" accept="video/*" multiple
             aria-label="選擇或加選影片" aria-describedby="fileCount">
      <p id="fileCount" class="muted">已選 0／130 部</p>
      <ul id="fileList" hidden></ul>
    </fieldset>
    <p class="muted">超過 19 MiB 自動分割。每封一段，附件從 0001 依序命名。</p>
  </section>

  <section class="panel" aria-labelledby="sendHeading">
    <h2 id="sendHeading">發送</h2>
    <div id="progressText">尚未開始</div>
    <progress id="progress" max="100" value="0" aria-label="本批處理進度"></progress>
    <p id="status" class="notice" role="status">工具尚未啟動。若重新整理後仍顯示此訊息，請重新上傳完整的 index.html。</p>
    <p id="sentSize" class="muted" hidden></p>
    <div class="row stack">
      <button type="button" id="start" disabled>開始發送</button>
      <button type="button" id="stop" class="warn" hidden>暫停</button>
      <button type="button" id="startOver" class="secondary" hidden>新批次</button>
    </div>
    <div id="issues" class="stack" hidden>
      <h3>需要處理</h3>
      <ul id="issueList"></ul>
      <div class="row">
        <button type="button" id="sendReady" class="secondary" hidden>只寄已準備的影片</button>
        <button type="button" id="retry" class="secondary" hidden>重試寄送失敗的附件</button>
      </div>
    </div>
    <details id="records" class="stack">
      <summary>詳細紀錄</summary>
      <p class="muted">請保持分頁開啟。重新整理或關閉分頁會清除未寄送佇列。已寄容量以附件大小計算。</p>
      <pre id="queueInfo">目前沒有佇列</pre>
      <pre id="log">等待操作…</pre>
    </details>
  </section>
</main>
<script>
'use strict';

const OAUTH_CLIENT_ID='612458875877-1ollgc131numte9m68512cotu26b2qri.apps.googleusercontent.com';

const $ = id => document.getElementById(id);
const MB = 1024 * 1024;
const MAX = 19 * MB;
const FILE_LIMIT = 130;
const GMAIL_SCOPE = 'https://www.googleapis.com/auth/gmail.send';
const sleep = ms => new Promise(resolve => setTimeout(resolve, ms));

let token = '';
let authPending = false;
let gisReady = false;
let gisError = '';
let ffmpeg = null;
let loadingFFmpeg = null;
let sources = [];
let items = [];
let batch = null;
let phase = '';
let stopRequested = false;
let refreshTimer = 0;
let lastIssues = '';
const logs = [];
const busy = () => !!phase || authPending;
const errorMessage = error => error?.message || String(error);

function log(message) {
  const time = new Date().toLocaleTimeString('zh-TW', {hour12: false});
  logs.push(`[${time}] ${message}`);
  if (logs.length > 200) logs.shift();
  refresh();
}

function status(message) {
  $('status').textContent = message;
  log(message);
}

function refresh() {
  if (!refreshTimer) refreshTimer = setTimeout(render, 160);
}

function updateRecord(id, text) {
  const element = $(id);
  if (element.textContent === text) return;
  const atBottom = element.scrollHeight - element.scrollTop - element.clientHeight < 45;
  element.textContent = text;
  if (atBottom) element.scrollTop = element.scrollHeight;
}

function render() {
  clearTimeout(refreshTimer);
  refreshTimer = 0;
  const counts = {ready: 0, sending: 0, sent: 0, failed: 0, uncertain: 0};
  let sentBytes = 0;
  for (const item of items) {
    counts[item.state]++;
    if (item.state === 'sent') sentBytes += item.blob.size;
  }
  const preparedSources = sources.filter(source => source.parts).length;
  const preparedParts = sources.reduce((sum, source) => sum + (source.parts?.length || 0), 0);
  const sourceIssues = sources.filter(source => source.problem);
  const locked = busy();
  const runningBatch = phase === 'preparing' || phase === 'sending';
  const canSendSubset = !batch && sourceIssues.length && preparedParts;

  $('recipientText').textContent = (batch?.email || $('recipient').value.trim()) || '尚未設定';
  $('authState').textContent = token ? 'Gmail 已連線' : authPending ? '正在連結 Gmail' : 'Gmail 尚未連線';
  $('login').hidden = !!token;
  $('login').disabled = locked;
  $('logout').hidden = !token;
  $('logout').disabled = locked;
  $('testCore').disabled = locked;
  $('prepareOnly').disabled = locked || !!batch || !sources.length;
  $('recipient').disabled = locked || !!batch;
  $('subject').disabled = locked || !!batch;

  $('fileControls').disabled = !!phase || !!batch;
  $('fileCount').textContent = `已選 ${sources.length}／${FILE_LIMIT} 部`;
  $('start').hidden = !!batch && counts.ready === 0 && phase !== 'sending';
  $('start').disabled = locked || !sources.length;
  $('start').textContent =
    batch ? '繼續發送' : sourceIssues.length ? '重試分割並發送' : '開始發送';
  $('stop').hidden = !runningBatch;
  $('stop').disabled = stopRequested;
  $('stop').textContent = stopRequested ? '暫停中…' : '暫停';
  $('startOver').hidden = !batch || locked;
  $('sendReady').hidden = !canSendSubset || locked;
  $('sendReady').textContent = `只寄已準備的 ${preparedParts} 封`;
  $('retry').hidden = !counts.failed || locked;
  $('retry').textContent = `重試失敗的 ${counts.failed} 封`;

  let progressText = sources.length ? '等待開始' : '尚未開始';
  let progress = 0;
  if (items.length) {
    const states = [];
    if (counts.sending) states.push(`寄送中 ${counts.sending}`);
    if (counts.ready) states.push(`待寄 ${counts.ready}`);
        if (counts.failed) states.push(`失敗 ${counts.failed}`);
    if (counts.uncertain) states.push(`待核對 ${counts.uncertain}`);
    progressText = [`Gmail 已寄 ${counts.sent}／${items.length} 封`, ...states].join(' ・ ');
    progress = counts.sent / items.length * 100;
  } else if (phase === 'preparing' || preparedSources) {
    progressText = `已準備 ${preparedSources}／${sources.length} 部`;
    progress = preparedSources / sources.length * 100;
  }
  $('progressText').textContent = progressText;
  $('progress').value = progress;
  $('sentSize').hidden = !counts.sent;
  $('sentSize').textContent = `已寄附件 ${(sentBytes / MB).toFixed(1)} MiB`;

  const issueTexts = sourceIssues.map(source => `${source.file.name} — ${source.problem}`);
  for (const item of items) {
    if (item.state === 'failed') issueTexts.push(`${item.name}（${item.originalName}） — ${item.error}`);
    if (item.state === 'uncertain') {
      issueTexts.push(`${item.name}（${item.originalName}） — 請先到 Gmail 已寄件核對`);
    }
  }
  const issueKey = JSON.stringify(issueTexts);
  $('issues').hidden = !issueTexts.length;
  if (issueKey !== lastIssues) {
    lastIssues = issueKey;
    $('issueList').replaceChildren(...issueTexts.map(text => {
      const li = document.createElement('li');
      li.textContent = text;
      return li;
    }));
  }

  if ($('records').open) {
    const stateLabels = {ready: '待寄', sending: '寄送中', sent: '已寄', failed: '失敗', uncertain: '待核對'};
    const begin = Math.max(0, items.length - 100);
    const queue = items.slice(begin).map(item =>
      `${item.name} — ${(item.blob.size / MB).toFixed(2)} MiB — ${stateLabels[item.state]}`
    );
    if (begin) queue.unshift(`顯示最後 100 段，前 ${begin} 段仍在佇列。`);
    updateRecord('queueInfo', queue.join('\n') || '目前沒有佇列');
    updateRecord('log', logs.join('\n') || '等待操作…');
  }
}

function renderFiles() {
  const list = $('fileList');
  list.hidden = !sources.length;
  list.replaceChildren(...sources.map(({file}, index) => {
    const row = document.createElement('li');
    const name = document.createElement('span');
    name.className = 'file-name';
    name.textContent = `${file.name} · ${(file.size / MB).toFixed(1)} MiB`;
    const remove = document.createElement('button');
    remove.type = 'button';
    remove.className = 'secondary';
    remove.dataset.index = index;
    remove.textContent = '移除';
    remove.setAttribute('aria-label', `移除 ${file.name}`);
    row.append(name, remove);
    return row;
  }));
}

const fileInput = $('files');
fileInput.onchange = () => {
  const files = Array.from(fileInput.files);
  if (phase || batch || !files.length) return;
  if (sources.length + files.length > FILE_LIMIT) {
    fileInput.value = '';
    status(`最多可選 ${FILE_LIMIT} 部，目前還能加選 ${FILE_LIMIT - sources.length} 部。`);
    return;
  }
  sources.push(...files.map(file => ({file, parts: null, problem: ''})));
  renderFiles();
  status(`已選 ${sources.length} 部影片。`);
  render();
};
$('fileList').onclick = event => {
  const remove = event.target.closest('button[data-index]');
  if (!remove || phase || batch) return;
  sources.splice(Number(remove.dataset.index), 1);
  fileInput.value = '';
  renderFiles();
  status(sources.length ? `已選 ${sources.length} 部影片。` : '請選擇要寄送的影片。');
  render();
};

const gisScript = document.createElement('script');
gisScript.src = 'https://accounts.google.com/gsi/client';
gisScript.async = true;
gisScript.onload = () => {
  gisReady = !!window.google?.accounts?.oauth2;
  log(gisReady ? 'Google 登入元件已就緒' : 'Google 登入元件未初始化');
};
gisScript.onerror = () => {
  gisError = 'Google 登入元件載入失敗，請檢查網路或內容封鎖。';
  log(gisError);
};
document.head.appendChild(gisScript);

function finishAuth(message) {
  authPending = false;
  status(message);
  render();
}

$('login').onclick = () => {
  if (busy()) return;
  if (!gisReady) {
    status(gisError || 'Google 登入元件尚未就緒，請稍後再試。');
    return;
  }
  authPending = true;
  status('正在開啟 Google 授權視窗…');
  render();
  try {
    const client = google.accounts.oauth2.initTokenClient({
      client_id: OAUTH_CLIENT_ID,
      scope: GMAIL_SCOPE,
      callback: response => {
        if (response.error || !response.access_token) {
          finishAuth(`Gmail 授權未完成${response.error ? '：' + response.error : ''}。`);
          return;
        }
        token = response.access_token;
        finishAuth('Gmail 已連線。');
      },
      error_callback: error => finishAuth(`Google 授權視窗未完成（${error.type || '未知原因'}）。`)
    });
    client.requestAccessToken({prompt: 'consent'});
  } catch (error) {
    finishAuth('Gmail 登入無法啟動：' + errorMessage(error));
  }
};

$('logout').onclick = () => {
  if (busy()) return;
  const previous = token;
  token = '';
  if (previous && gisReady) google.accounts.oauth2.revoke(previous, () => {});
  finishAuth('已中斷 Gmail 連線。');
};

$('testCore').onclick = async () => {
  if (busy()) return;
  phase = 'diagnosing';
  render();
  try {
    await loadFFmpeg();
    status('FFmpeg 核心可用。');
  } catch (error) {
    log('核心診斷：' + errorMessage(error));
  } finally {
    phase = '';
    render();
  }
};

async function prepareSources() {
  for (const [index, source] of sources.entries()) {
    if (stopRequested) return;
    if (source.parts) continue;
    const {file} = source;
    source.problem = '';
    status(`準備第 ${index + 1}／${sources.length} 部：${file.name}`);
    try {
      if (!file.size) throw new Error('檔案是空的');
      source.parts = file.size <= MAX ? [{name: file.name, blob: file}] : await splitVideo(file);
      if (!source.parts.length) throw new Error('沒有產生可寄送的影片片段');
    } catch (error) {
      source.parts = null;
      if (stopRequested) return;
      source.problem = errorMessage(error);
      log(`準備失敗：${file.name} — ${source.problem}`);
    }
    refresh();
  }
}

function readSettings() {
  const recipient = $('recipient');
  if (!recipient.checkValidity() || !recipient.value.trim()) {
    $('settings').open = true;
    recipient.focus();
    recipient.reportValidity();
    throw new Error('請輸入正確的收件人 Email。');
  }
  return {email: recipient.value.trim(), subject: $('subject').value.trim() || '影片附件'};
}

function createItems() {
  return sources.flatMap(source => (source.parts || []).map(part => ({
    originalName: source.file.name,
    name: part.name,
    blob: part.blob,
    state: 'ready',
    error: ''
  }))).map((item, index) => ({...item, name: numberedAttachmentName(item.name, index)}));
}

async function sendOne(item, index) {
  const accessToken = token;
  const boundary = 'video_' + Date.now() + '_' + index;
  const subject = batch.subject + ` ${index + 1}/${items.length}`;
  const filename = item.name;
  const header = [
    `To: ${batch.email}`,
    `Subject: =?UTF-8?B?${b64utf8(subject)}?=`,
    'MIME-Version: 1.0',
    `Content-Type: multipart/mixed; boundary="${boundary}"`,
    '',
    `--${boundary}`,
    'Content-Type: text/plain; charset=UTF-8',
    'Content-Transfer-Encoding: base64',
    '',
    b64utf8('影片附件：' + filename),
    `--${boundary}`,
    `Content-Type: ${item.blob.type || 'application/octet-stream'}; name="attachment"`,
    `Content-Disposition: attachment; filename="${filename}"`,
    'Content-Transfer-Encoding: base64',
    '',
    ''
  ].join('\r\n');
  const attachment = await encodeAttachment(item.blob);
  const raw = b64urlBytes(new TextEncoder().encode(header + attachment + `\r\n--${boundary}--\r\n`));
  let response;
  try {
    response = await fetch('https://gmail.googleapis.com/gmail/v1/users/me/messages/send', {
      method: 'POST',
      headers: {Authorization: 'Bearer ' + accessToken, 'Content-Type': 'application/json'},
      body: JSON.stringify({raw})
    });
  } catch (cause) {
    const error = new Error('連線中斷，Gmail 寄送結果未確認', {cause});
    error.uncertain = true;
    throw error;
  }
  if (!response.ok) {
    const detail = await response.text().catch(() => '');
    const error = new Error(`Gmail HTTP ${response.status}: ${detail.slice(0, 240)}`);
    error.httpStatus = response.status;
    error.uncertain = response.status === 408 || response.status >= 500;
    throw error;
  }
  return await response.json().catch(() => null);
}

async function sendQueued(retryFailed) {
  const targetState = retryFailed ? 'failed' : 'ready';
  const targets = items.map((item, index) => ({item, index}))
    .filter(({item}) => item.state === targetState);
  if (!targets.length) {
    status('沒有可寄送的附件。');
    return;
  }
  let cursor = 0;
  let haltReason = '';
  const worker = async () => {
    while (!stopRequested && cursor < targets.length) {
      const {item, index} = targets[cursor++];
      item.state = 'sending';
      item.error = '';
      refresh();
      const startedAt = performance.now();
      try {
        const result = await sendOne(item, index);
        item.state = 'sent';
        log(`寄送成功：${item.name}／${((performance.now() - startedAt) / 1000).toFixed(1)} 秒${result?.id ? '／Gmail ID: ' + result.id : ''}`);
      } catch (error) {
        item.error = errorMessage(error);
        item.state = error.uncertain ? 'uncertain' : 'failed';
        log(`寄送異常：${item.name} — ${item.error}`);
        if (error.httpStatus === 401) token = '';
        if (error.uncertain) {
          haltReason = '寄送結果未確認。請先到 Gmail 已寄件核對標示的附件。';
          stopRequested = true;
        } else if ([401, 403, 429].includes(error.httpStatus)) {
          haltReason ||= error.httpStatus === 401
            ? 'Gmail 授權已失效，請重新連線。'
            : 'Gmail 暫時拒絕寄送，請查看詳細紀錄。';
          stopRequested = true;
        }
      } finally {
        refresh();
      }
    }
  };
  status('正在寄送附件…');
  await Promise.all(Array.from({length: Math.min(2, targets.length)}, worker));
    if (haltReason) status(haltReason);
  else if (stopRequested) status('已暫停。已開始的郵件已處理，待寄附件仍在佇列。');
  else if (items.every(item => item.state === 'sent')) {
    const omitted = sources.filter(source => !source.parts).length;
    status(omitted ? `所選附件已發送。另有 ${omitted} 部影片尚未寄送。` : '本批發送完成。');
  }
  else if (items.some(item => item.state === 'uncertain')) status('請核對標示為待核對的附件。');
  else status('本輪寄送結束，可繼續發送或重試失敗附件。');
}

async function start({usePreparedFiles = false, onlyPrepare = false, retryFailed = false} = {}) {
  if (busy() || !sources.length || (onlyPrepare && batch)) return;
  if (!onlyPrepare && !token) {
    status('請先連結 Gmail。');
    $('login').focus();
    return;
  }
  stopRequested = false;
  try {
    const settings = onlyPrepare ? null : batch || readSettings();
    if (!batch) {
      phase = 'preparing';
      render();
      if (!usePreparedFiles) await prepareSources();
      if (stopRequested) {
        status('已暫停準備，已完成的影片仍保留。');
        return;
      }
      if (!usePreparedFiles && sources.some(source => source.problem)) {
        status('有影片準備失敗。可以換檔、重試分割，或只寄已準備的影片。');
        return;
      }
      if (onlyPrepare) {
        const parts = sources.flatMap(source => source.parts);
        const bytes = parts.reduce((total, part) => total + part.blob.size, 0);
        status(`已準備 ${parts.length} 個附件，共 ${(bytes / MB).toFixed(1)} MiB。請保留這個分頁，等你按開始發送。`);
        return;
      }
      items = createItems();
      if (!items.length) throw new Error('沒有可寄送的附件。');
      batch = settings;
    }
    phase = 'sending';
    render();
    await sendQueued(retryFailed);
  } catch (error) {
    status(errorMessage(error));
  } finally {
    phase = '';
    render();
  }
}

$('start').onclick = () => start();
$('prepareOnly').onclick = () => start({onlyPrepare: true});
$('sendReady').onclick = () => start({usePreparedFiles: true});
$('retry').onclick = () => start({retryFailed: true});
$('stop').onclick = () => {
  if (phase !== 'preparing' && phase !== 'sending') return;
  stopRequested = true;
  status('正在暫停，請等目前步驟結束。');
  render();
};
$('startOver').onclick = () => {
  if (busy() || !batch) return;
  if ((items.some(item => item.state !== 'sent') || sources.some(source => !source.parts)) &&
      !window.confirm('還有未寄送或待核對的附件。清除這批佇列並開始新批次？')) return;
  sources = [];
  items = [];
  batch = null;
  fileInput.value = '';
  renderFiles();
  status('請選擇要寄送的影片。');
  render();
};

function rememberRecipient() {
  try { localStorage.setItem('v44_recipient', $('recipient').value); } catch (_) {}
  render();
}
try { $('recipient').value = localStorage.getItem('v44_recipient') || ''; } catch (_) {}
$('recipient').oninput = render;
$('recipient').onchange = rememberRecipient;
$('records').ontoggle = render;
$('settings').open = !$('recipient').value;

async function loadFFmpeg(){if(ffmpeg)return ffmpeg;if(loadingFFmpeg)return loadingFFmpeg;loadingFFmpeg=(async()=>{const base=new URL('./',location.href),coreJs=new URL('ffmpeg-core.js',base).href,coreWasm=new URL('ffmpeg-core.wasm',base).href;status('步驟 1/4：檢查本站 FFmpeg 核心…');for(const url of [coreJs,coreWasm]){const r=await fetch(url,{method:'HEAD',cache:'no-store',signal:AbortSignal.timeout(15000)});if(!r.ok)throw Error('核心檔案無法存取：'+url.split('/').pop()+' HTTP '+r.status)}status('步驟 2/4：載入 FFmpeg 控制程式…');const cdn='https://cdn.jsdelivr.net/npm/@ffmpeg/ffmpeg@0.12.15/dist/esm/';const mod=await import(cdn+'index.js');const util=await import('https://cdn.jsdelivr.net/npm/@ffmpeg/util@0.12.2/dist/esm/index.js');status('步驟 3/4：建立手機相容 Worker…');const response=await fetch(cdn+'worker.js',{signal:AbortSignal.timeout(20000)});if(!response.ok)throw Error('Worker 下載失敗：HTTP '+response.status);let source=await response.text();source=source.replace(/(from\s*['"]|import\s*\(\s*['"])(\.\.?\/[^'"]+)/g,(_,prefix,path)=>prefix+new URL(path,cdn).href);log('Worker 程式長度：'+source.length+' 字元');const workerUrl=URL.createObjectURL(new Blob([source],{type:'text/javascript'}));status('步驟 3/4：測試 Worker 是否能啟動…');const probeURL=URL.createObjectURL(new Blob([`postMessage('ready');`],{type:'text/javascript'}));try{await new Promise((resolve,reject)=>{const probe=new Worker(probeURL,{type:'module'});const timer=setTimeout(()=>{probe.terminate();reject(new Error('模組 Worker 測試逾時'))},12000);probe.onmessage=()=>{clearTimeout(timer);probe.terminate();resolve()};probe.onerror=e=>{clearTimeout(timer);probe.terminate();reject(new Error('模組 Worker 無法啟動：'+(e.message||'可能被瀏覽器或 CDN 阻擋')))};probe.onmessageerror=()=>{clearTimeout(timer);probe.terminate();reject(new Error('Worker 訊息格式錯誤'))}});log('Worker 模組測試成功')}finally{URL.revokeObjectURL(probeURL)}status('步驟 3/4：將 UMD 核心轉成 Worker 可載入的模組…');const coreResponse=await fetch(coreJs,{cache:'no-store',signal:AbortSignal.timeout(20000)});if(!coreResponse.ok)throw Error('下載 ffmpeg-core.js 失敗：HTTP '+coreResponse.status);const coreSource=await coreResponse.text();if(!coreSource.includes('createFFmpegCore'))throw Error('ffmpeg-core.js 內容不是預期的 FFmpeg 核心');const moduleSource=coreSource+'\nexport default createFFmpegCore;\n';const coreModuleURL=URL.createObjectURL(new Blob([moduleSource],{type:'text/javascript'}));log('已將本站 UMD 核心包裝成 ES Module（'+moduleSource.length+' 字元）');const engine=new mod.FFmpeg();engine.on('log',({message})=>{if(/error|failed|invalid/i.test(message))log('FFmpeg: '+message.slice(0,160))});status('步驟 4/4：啟動 FFmpeg（最多等待 60 秒）…');let timer;try{await Promise.race([engine.load({classWorkerURL:workerUrl,coreURL:coreModuleURL,wasmURL:coreWasm}),new Promise((_,reject)=>{timer=setTimeout(()=>reject(Error('啟動超過 60 秒；可能是 Worker 或手機記憶體限制')),60000)})])}catch(e){const detail=e instanceof Error?(e.stack||e.message):e&&typeof e==='object'?JSON.stringify(e,Object.getOwnPropertyNames(e)):String(e);log('FFmpeg 啟動錯誤：'+detail.slice(0,1200));try{engine.terminate()}catch(_){}throw new Error(detail==='undefined'?'Worker 啟動失敗，原始錯誤未提供內容（可能是模組載入或核心不相容）':detail)}finally{clearTimeout(timer);URL.revokeObjectURL(workerUrl);URL.revokeObjectURL(coreModuleURL)}ffmpeg={engine,util};status('FFmpeg 核心載入成功');return ffmpeg})();try{return await loadingFFmpeg}catch(e){status('FFmpeg 載入失敗：'+(e?.message||String(e)));throw e}finally{loadingFFmpeg=null}}
function numberedAttachmentName(original,index){const match=/\.([a-zA-Z0-9]{1,10})$/.exec(original);const ext=match?match[1].toLowerCase():'mp4';return String(index+1).padStart(4,'0')+'.'+ext}
function clean(s){return s.replace(/[^a-zA-Z0-9._-]/g,'_').slice(0,70)||'video'}
async function splitVideo(file){const {engine,util}=await loadFFmpeg();const source='in_'+Date.now()+'_'+clean(file.name),ext=(file.name.split('.').pop()||'mp4').toLowerCase(),outputExt=['mp4','mov','m4v'].includes(ext)?'mp4':(['webm','mkv'].includes(ext)?ext:'mp4');let duration=0,written=false;const result=[];try{status(`載入影片：${file.name} (${(file.size/MB).toFixed(1)}MiB)`);await engine.writeFile(source,await util.fetchFile(file));written=true;const messages=[];const handler=({message})=>{messages.push(message);if(messages.length>250)messages.shift()};engine.on('log',handler);try{await engine.exec(['-i',source,'-t','0.01','-f','null','-'])}finally{engine.off('log',handler)}const match=messages.join('\n').match(/Duration:\s*(\d+):(\d+):(\d+(?:\.\d+)?)/);if(match)duration=Number(match[1])*3600+Number(match[2])*60+Number(match[3]);if(!duration)throw Error('無法讀取影片時長，請先轉成 MP4');let start=0,index=0;while(start<duration-.03){if(stopRequested)throw Error('已暫停準備程序');if(index++>1000)throw Error('分割段數過多');const left=duration-start;let seconds=Math.min(left,Math.max(.5,duration*MAX/file.size*.78)),success=false;for(let attempt=0;attempt<9;attempt++){const out=`out_${Date.now()}_${index}_${attempt}.${outputExt}`;try{const code=await engine.exec(['-ss',String(start),'-i',source,'-t',String(seconds),'-map','0:v:0','-map','0:a?','-c','copy','-avoid_negative_ts','make_zero','-y',out]);if(code!==0)throw Error('無法無損分割此影片，請先轉為 MP4');const data=await engine.readFile(out);if(data.byteLength>0&&data.byteLength<=MAX){result.push({name:`${file.name.replace(/\.[^.]+$/,'')}_part${String(index).padStart(3,'0')}.${outputExt}`,blob:new Blob([data],{type:outputExt==='webm'?'video/webm':outputExt==='mkv'?'video/x-matroska':'video/mp4'}),state:'ready'});start+=seconds;success=true;status(`已分割 ${file.name}：第 ${index} 段 (${(data.byteLength/MB).toFixed(2)}MiB)`);break}}finally{try{await engine.deleteFile(out)}catch(_){}}seconds*=.65;if(seconds<.3)break}if(!success)throw Error('無法安全分割到 19MiB；建議改用電腦或先壓縮影片')}return result}finally{if(written)try{await engine.deleteFile(source)}catch(_){}}}
function b64utf8(s){return btoa(unescape(encodeURIComponent(s)))}
function b64urlBytes(bytes){let s='';for(let i=0;i<bytes.length;i+=32768)s+=String.fromCharCode(...bytes.subarray(i,i+32768));return btoa(s).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'')}
// Yield between attachment encoding chunks so the mobile UI can process scrolling.
async function encodeAttachment(blob){const bytes=new Uint8Array(await blob.arrayBuffer());const chunks=[];const step=3*8192;for(let i=0;i<bytes.length;i+=step){const part=bytes.subarray(i,i+step);let binary='';for(let j=0;j<part.length;j++)binary+=String.fromCharCode(part[j]);chunks.push(btoa(binary));if((i/step)%8===7)await sleep(0)}return chunks.join('')}
